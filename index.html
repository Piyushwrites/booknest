<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phase 1</title>

  <!-- FIX: Safely encoded the ampersand in the Google Fonts URL -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f3e8ff',
              100: '#e9d5ff',
              500: '#a855f7',
              600: '#6439FF',
              700: '#7e22ce',
            },
            background: '#f8f9fc',
          }
        }
      }
    }
  </script>

  <!-- Custom Scrollbar & Body Styles -->
  <style>
    body {
      background-color: #f8f9fc;
      color: #111827;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 10px;
    }
  </style>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router DOM (UMD) -->
  <script crossorigin src="https://unpkg.com/@remix-run/router@1.16.1/dist/router.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router@6.23.1/dist/umd/react-router.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@6.23.1/dist/umd/react-router-dom.development.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React Root -->
  <div id="root"></div>

  <!-- Application Code -->
  <script type="text/babel" data-type="module">
    const { useState } = React;
    const { HashRouter, Routes, Route, NavLink, useLocation, Outlet } = window.ReactRouterDOM;

    // --- 1. ICON COMPONENTS ---
    const Icon = ({ children, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Icons = {
      BookOpen: ({className}) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>,
      LayoutDashboard: ({className}) => <Icon className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>,
      Library: ({className}) => <Icon className={className}><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></Icon>,
      CheckCircle2: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
      ShoppingCart: ({className}) => <Icon className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Icon>,
      Settings: ({className}) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>,
      Info: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>,
      Plus: ({className}) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>,
      Hash: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></Icon>,
      Search: ({className}) => <Icon className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>,
      Bell: ({className}) => <Icon className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Icon>,
      Menu: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>
    };

    // --- 2. LAYOUT COMPONENTS ---
    const mainLinks = [
      { name: 'Dashboard', path: '/', icon: Icons.LayoutDashboard },
      { name: 'My Books', path: '/books', icon: Icons.Library },
      { name: 'Currently Reading', path: '/reading', icon: Icons.BookOpen },
      { name: 'Finished', path: '/finished', icon: Icons.CheckCircle2 },
      { name: 'To Buy', path: '/to-buy', icon: Icons.ShoppingCart },
    ];

    // FIX: Removed the raw ampersand from "AI & Technology" to prevent Babel parse errors
    const collections = [
      'All Collections', 'AI and Technology', 'Psychology', 
      'Philosophy', 'Spirituality', 'Business', 'Fiction'
    ];

    function Sidebar() {
      const navClass = ({ isActive }) =>
        `flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${
          isActive 
            ? 'bg-brand-50 text-brand-600' 
            : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'
        }`;

      return (
        <aside className="w-64 h-screen bg-white border-r border-gray-100 flex flex-col sticky top-0 shrink-0">
          <div className="h-20 flex items-center px-6 gap-2 text-brand-600 font-bold text-xl">
            <Icons.BookOpen className="w-6 h-6 fill-current" />
            <span>BookNest</span>
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-2 space-y-8 custom-scrollbar">
            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">MAIN</p>
              <nav className="flex flex-col gap-1">
                {mainLinks.map((link) => (
                  <NavLink key={link.name} to={link.path} className={navClass}>
                    <link.icon className="w-4 h-4" />
                    {link.name}
                  </NavLink>
                ))}
              </nav>
            </div>

            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">COLLECTIONS</p>
              <nav className="flex flex-col gap-1">
                {collections.map((collection, idx) => (
                  <NavLink key={collection} to={`/collections/${idx}`} className={navClass}>
                    <Icons.Hash className="w-4 h-4" />
                    {collection}
                  </NavLink>
                ))}
                <button className="flex items-center gap-3 px-4 py-2.5 mt-2 text-sm font-medium text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                  <Icons.Plus className="w-4 h-4" />
                  New Collection
                </button>
              </nav>
            </div>
          </div>

          <div className="p-4 border-t border-gray-100">
            <nav className="flex flex-col gap-1">
              <NavLink to="/settings" className={navClass}>
                <Icons.Settings className="w-4 h-4" />
                Settings
              </NavLink>
              <NavLink to="/about" className={navClass}>
                <Icons.Info className="w-4 h-4" />
                About
              </NavLink>
            </nav>
          </div>
        </aside>
      );
    }

    function Topbar() {
      const location = useLocation();
      const getPageTitle = () => {
        switch (location.pathname) {
          case '/': return 'Dashboard';
          case '/books': return 'My Books';
          case '/to-buy': return 'To Buy';
          default: return 'BookNest';
        }
      };

      return (
        <header className="h-20 px-8 flex items-center justify-between bg-background sticky top-0 z-10">
          <div className="flex items-center gap-4">
            <button className="lg:hidden text-gray-500 hover:text-gray-900">
              <Icons.Menu className="w-6 h-6" />
            </button>
            <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
              <Icons.Menu className="w-5 h-5 hidden lg:block text-gray-400" /> 
              {getPageTitle()}
            </h1>
          </div>

          <div className="flex items-center gap-6">
            <div className="relative hidden md:block">
              <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
              <input 
                type="text" 
                placeholder="Search books..." 
                className="pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-full text-sm w-64 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
              />
            </div>
            <button className="relative text-gray-500 hover:text-brand-600 transition-colors">
              <Icons.Bell className="w-5 h-5" />
              <span className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
            </button>
            <div className="w-9 h-9 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-semibold cursor-pointer shadow-md shadow-brand-500/30">
              PS
            </div>
          </div>
        </header>
      );
    }

    function MainLayout() {
      return (
        <div className="flex h-screen w-full overflow-hidden bg-background">
          <Sidebar />
          <div className="flex-1 flex flex-col min-w-0">
            <Topbar />
            <main className="flex-1 overflow-y-auto px-8 pb-8 custom-scrollbar">
              <Outlet />
            </main>
          </div>
        </div>
      );
    }

    // --- 3. PLACEHOLDER PAGES FOR PHASE 1 ---
    const Dashboard = () => (
      <div className="bg-white rounded-xl p-8 border border-gray-100 shadow-sm">
        <h2 className="text-xl font-bold mb-2">Good morning, Piyush! 👋</h2>
        <p className="text-gray-500">Let's continue your reading journey.</p>
      </div>
    );

    const MyBooks = () => (
      <div className="bg-white rounded-xl p-8 border border-gray-100 shadow-sm h-96 flex items-center justify-center text-gray-400">
        My Books grid placeholder
      </div>
    );

    // --- 4. APP ENTRY POINT ---
    function App() {
      return (
        <HashRouter>
          <Routes>
            <Route path="/" element={<MainLayout />}>
              <Route index element={<Dashboard />} />
              <Route path="books" element={<MyBooks />} />
              <Route path="to-buy" element={<div className="text-gray-400 p-8 bg-white rounded-xl border border-gray-100 h-96 flex items-center justify-center">To Buy List Placeholder</div>} />
              <Route path="*" element={<div className="text-gray-400 p-8 bg-white rounded-xl border border-gray-100 h-96 flex items-center justify-center">Feature coming soon...</div>} />
            </Route>
          </Routes>
        </HashRouter>
      );
    }

    // Render the App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
