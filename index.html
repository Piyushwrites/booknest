<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phase 1 to 7</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#f3e8ff', 100: '#e9d5ff', 500: '#a855f7', 600: '#6439FF', 700: '#7e22ce' },
            background: '#f8f9fc',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.3s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Scrollbar & Body Styles -->
  <style>
    body { background-color: #f8f9fc; color: #111827; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 10px; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router DOM (UMD) -->
  <script crossorigin src="https://unpkg.com/@remix-run/router@1.16.1/dist/router.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router@6.23.1/dist/umd/react-router.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@6.23.1/dist/umd/react-router-dom.development.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useMemo, createContext, useContext, useEffect, useRef, useCallback } = React;
    const { HashRouter, Routes, Route, NavLink, useLocation, Outlet, useNavigate, useParams } = window.ReactRouterDOM;

    // ==========================================
    // 1. ICONS
    // ==========================================
    const Icon = ({ children, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{children}</svg>
    );
    const Icons = {
      BookOpen: ({className}) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>,
      LayoutDashboard: ({className}) => <Icon className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>,
      Library: ({className}) => <Icon className={className}><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></Icon>,
      CheckCircle2: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
      ShoppingCart: ({className}) => <Icon className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Icon>,
      Settings: ({className}) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>,
      Plus: ({className}) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>,
      Hash: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></Icon>,
      Search: ({className}) => <Icon className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>,
      Menu: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>,
      X: ({className}) => <Icon className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>,
      MoreVertical: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></Icon>,
      Grid: ({className}) => <Icon className={className}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Icon>,
      List: ({className}) => <Icon className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></Icon>,
      Star: ({className}) => <Icon className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>,
      ArrowLeft: ({className}) => <Icon className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></Icon>,
      Edit2: ({className}) => <Icon className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></Icon>,
      Trash2: ({className}) => <Icon className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>,
      Download: ({className}) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Icon>,
      Upload: ({className}) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>,
      RefreshCw: ({className}) => <Icon className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></Icon>,
      Target: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>,
      TrendingUp: ({className}) => <Icon className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>,
      ChevronRight: ({className}) => <Icon className={className}><polyline points="9 18 15 12 9 6"/></Icon>,
      AlertCircle: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>
    };

    // ==========================================
    // 2. TOAST SYSTEM (Phase 7 - User Feedback)
    // ==========================================
    const ToastContext = createContext();
    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((msg, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      }, []);

      return (
        <ToastContext.Provider value={addToast}>
          {children}
          <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 animate-fade-in-up pointer-events-auto
                ${t.type === 'success' ? 'bg-gray-900 text-white' : t.type === 'error' ? 'bg-red-600 text-white' : 'bg-brand-600 text-white'}`}>
                {t.type === 'success' ? <Icons.CheckCircle2 className="w-4 h-4"/> : <Icons.AlertCircle className="w-4 h-4"/>}
                {t.msg}
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    };

    const useToast = () => useContext(ToastContext);

    // ==========================================
    // 3. STORAGE & STATE MANAGEMENT
    // ==========================================
    const STORAGE_KEY = 'booknest_app_data_v1';
    const defaultCollections = [{ id: 'c1', name: 'AI and Technology' }, { id: 'c2', name: 'Psychology' }, { id: 'c3', name: 'Philosophy' }, { id: 'c4', name: 'Business' }, { id: 'c5', name: 'Fiction' }];
    const defaultBooks = [
      { id: '1', title: 'Atomic Habits', author: 'James Clear', cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Atomic\nHabits', status: 'Finished', progress: 100, rating: 5, dateAdded: '2026-01-10T10:00:00.000Z', dateFinished: '2026-02-15T10:00:00.000Z', totalPages: 320, readPages: 320, genre: 'Self Help', isbn: '978-1847941831', ownership: 'Owned', wantToBuy: false, priority: 'Medium', price: 0, collections: ['c2', 'c4'], notes: 'Focus on tiny changes. Systems over goals.' },
      { id: '2', title: 'Deep Work', author: 'Cal Newport', cover: 'https://placehold.co/300x450/f0f4f8/333333?text=Deep\nWork', status: 'Currently Reading', progress: 62, rating: 0, dateAdded: '2026-05-12T10:00:00.000Z', totalPages: 296, readPages: 184, genre: 'Productivity', isbn: '978-1455586691', ownership: 'Owned', wantToBuy: false, priority: 'Medium', price: 0, collections: ['c4'], notes: 'Rules for focused success in a distracted world.' },
      { id: '3', title: 'The Almanack of Naval Ravikant', author: 'Eric Jorgenson', cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Naval\nRavikant', status: 'Unread', progress: 0, rating: 0, dateAdded: '2026-06-20T10:00:00.000Z', totalPages: 244, readPages: 0, genre: 'Business', isbn: '978-1544514215', ownership: 'Not Owned', wantToBuy: true, priority: 'High', price: 599, collections: ['c3', 'c4'], notes: 'Highly recommended.' },
      { id: '4', title: 'Sapiens', author: 'Yuval Noah Harari', cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Sapiens', status: 'Finished', progress: 100, rating: 4, dateAdded: '2026-03-10T10:00:00.000Z', dateFinished: '2026-04-22T10:00:00.000Z', totalPages: 443, readPages: 443, genre: 'History', isbn: '978-0062316097', ownership: 'Owned', wantToBuy: false, priority: 'Medium', price: 0, collections: ['c1'], notes: 'A brief history of humankind.' }
    ];

    const StorageService = {
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { books: defaultBooks, collections: defaultCollections, readingGoal: 50 };
          const parsed = JSON.parse(raw);
          return {
            books: Array.isArray(parsed.books) ? parsed.books : defaultBooks,
            collections: Array.isArray(parsed.collections) ? parsed.collections : defaultCollections,
            readingGoal: typeof parsed.readingGoal === 'number' ? parsed.readingGoal : 50
          };
        } catch (e) { return { books: defaultBooks, collections: defaultCollections, readingGoal: 50 }; }
      },
      save(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error(e); } },
      reset() { localStorage.removeItem(STORAGE_KEY); return { books: defaultBooks, collections: defaultCollections, readingGoal: 50 }; }
    };

    const BookContext = createContext();
    const BookProvider = ({ children }) => {
      const [data, setData] = useState(() => StorageService.load());
      useEffect(() => { StorageService.save(data); }, [data]);

      return (
        <BookContext.Provider value={{ 
          books: data.books, collections: data.collections, readingGoal: data.readingGoal,
          addBook: (bk) => setData(p => ({ ...p, books: [...p.books, { ...bk, id: Date.now().toString(), dateAdded: new Date().toISOString() }] })),
          updateBook: (bk) => setData(p => ({ ...p, books: p.books.map(b => b.id === bk.id ? bk : b) })),
          deleteBook: (id) => setData(p => ({ ...p, books: p.books.filter(b => b.id !== id) })),
          addCollection: (name) => { if (name.trim()) setData(p => ({ ...p, collections: [...p.collections, { id: 'c' + Date.now(), name: name.trim() }] })); },
          renameCollection: (id, name) => { if (name.trim()) setData(p => ({ ...p, collections: p.collections.map(c => c.id === id ? { ...c, name: name.trim() } : c) })); },
          deleteCollection: (id) => setData(p => ({ collections: p.collections.filter(c => c.id !== id), books: p.books.map(b => ({ ...b, collections: (b.collections || []).filter(cid => cid !== id) })) })),
          setReadingGoal: (goal) => setData(p => ({ ...p, readingGoal: goal })),
          exportLibrary: () => {
            const a = document.createElement('a');
            a.href = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(data, null, 2))}`;
            a.download = `booknest-backup-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a); a.click(); a.remove();
          },
          importLibrary: (d) => { if (!d || !Array.isArray(d.books) || !Array.isArray(d.collections)) throw new Error("Invalid format."); setData({ ...d, readingGoal: d.readingGoal || 50 }); },
          resetLibrary: () => setData(StorageService.reset())
        }}>
          {children}
        </BookContext.Provider>
      );
    };

    // ==========================================
    // 4. LAYOUT & RESPONSIVE NAVIGATION
    // ==========================================
    const LayoutContext = createContext();
    
    function Sidebar() {
      const { collections, addCollection } = useContext(BookContext);
      const { isMobileMenuOpen, setIsMobileMenuOpen } = useContext(LayoutContext);
      const addToast = useToast();

      const navClass = ({ isActive }) => `flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 ${isActive ? 'bg-brand-50 text-brand-600' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'}`;
      const closeMenu = () => setIsMobileMenuOpen(false);

      const handleNewCollection = () => { 
        const name = window.prompt('Enter new collection name:'); 
        if (name) { addCollection(name); addToast('Collection created'); }
        closeMenu();
      };

      return (
        <>
          {/* Mobile Overlay */}
          {isMobileMenuOpen && (
            <div className="fixed inset-0 bg-gray-900/50 z-40 md:hidden transition-opacity" onClick={closeMenu} aria-hidden="true" />
          )}

          {/* Sidebar */}
          <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-100 flex flex-col transform transition-transform duration-300 md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="h-20 flex items-center justify-between px-6 shrink-0">
              <div className="flex items-center gap-2 text-brand-600 font-bold text-xl">
                <Icons.BookOpen className="w-6 h-6 fill-current" /><span>BookNest</span>
              </div>
              <button onClick={closeMenu} className="md:hidden text-gray-400 hover:text-gray-900 p-1 rounded focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Close menu">
                <Icons.X className="w-5 h-5" />
              </button>
            </div>
            
            <div className="flex-1 overflow-y-auto px-4 py-2 space-y-8 custom-scrollbar">
              <div>
                <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">MAIN</p>
                <nav className="flex flex-col gap-1">
                  <NavLink to="/" onClick={closeMenu} className={navClass}><Icons.LayoutDashboard className="w-4 h-4" />Dashboard</NavLink>
                  <NavLink to="/books" onClick={closeMenu} className={navClass}><Icons.Library className="w-4 h-4" />My Books</NavLink>
                  <NavLink to="/to-buy" onClick={closeMenu} className={navClass}><Icons.ShoppingCart className="w-4 h-4" />To Buy</NavLink>
                </nav>
              </div>
              <div>
                <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">COLLECTIONS</p>
                <nav className="flex flex-col gap-1">
                  {collections.map((c) => <NavLink key={c.id} to={`/collections/${c.id}`} onClick={closeMenu} className={navClass}><Icons.Hash className="w-4 h-4" />{c.name}</NavLink>)}
                  <button onClick={handleNewCollection} className="flex items-center gap-3 px-4 py-2.5 mt-2 text-sm font-medium text-brand-600 hover:bg-brand-50 rounded-lg transition-colors text-left focus:outline-none focus:ring-2 focus:ring-brand-500"><Icons.Plus className="w-4 h-4" /> New Collection</button>
                </nav>
              </div>
            </div>
            <div className="p-4 border-t border-gray-100 shrink-0">
              <nav className="flex flex-col gap-1"><NavLink to="/settings" onClick={closeMenu} className={navClass}><Icons.Settings className="w-4 h-4" />Settings</NavLink></nav>
            </div>
          </aside>
        </>
      );
    }

    function Topbar() {
      const location = useLocation(); const navigate = useNavigate();
      const { collections } = useContext(BookContext);
      const { setIsMobileMenuOpen } = useContext(LayoutContext);

      const getPageTitle = () => {
        if (location.pathname === '/') return 'Dashboard';
        if (location.pathname === '/books') return 'My Books';
        if (location.pathname === '/books/add') return 'Add Book';
        if (location.pathname.includes('/edit')) return 'Edit Book';
        if (location.pathname.startsWith('/books/')) return 'Book Details';
        if (location.pathname === '/to-buy') return 'To Buy';
        if (location.pathname === '/settings') return 'Settings';
        if (location.pathname.startsWith('/collections/')) { const id = location.pathname.split('/')[2]; return collections.find(c => c.id === id)?.name || 'Collection'; }
        return 'BookNest';
      };

      return (
        <header className="h-16 md:h-20 px-4 md:px-8 flex items-center justify-between bg-background sticky top-0 z-30 shrink-0">
          <div className="flex items-center gap-3 md:gap-4">
            <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden text-gray-500 hover:text-gray-900 p-1 -ml-1 rounded focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Open menu"><Icons.Menu className="w-6 h-6" /></button>
            <h1 className="text-lg md:text-2xl font-bold text-gray-900 flex items-center gap-2 truncate"><Icons.Menu className="w-5 h-5 hidden md:block text-gray-400" aria-hidden="true" /> {getPageTitle()}</h1>
          </div>
          <div className="flex items-center gap-3 md:gap-6">
            <button onClick={() => navigate('/books/add')} className="hidden sm:flex items-center gap-2 bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"><Icons.Plus className="w-4 h-4" /> Add Book</button>
            <button onClick={() => navigate('/books/add')} className="sm:hidden flex items-center justify-center w-9 h-9 bg-brand-600 text-white rounded-full hover:bg-brand-700 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2" aria-label="Add Book"><Icons.Plus className="w-5 h-5" /></button>
            <div className="w-8 h-8 md:w-9 md:h-9 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs md:text-sm font-semibold cursor-pointer shadow-md shadow-brand-500/30 shrink-0" aria-label="User Profile">PS</div>
          </div>
        </header>
      );
    }

    function MainLayout() {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      return (
        <LayoutContext.Provider value={{ isMobileMenuOpen, setIsMobileMenuOpen }}>
          <div className="flex h-[100dvh] w-full overflow-hidden bg-background">
            <Sidebar />
            <div className="flex-1 flex flex-col min-w-0 h-full">
              <Topbar />
              <main className="flex-1 overflow-y-auto px-4 md:px-8 pb-8 custom-scrollbar">
                <div className="max-w-7xl mx-auto w-full"><Outlet /></div>
              </main>
            </div>
          </div>
        </LayoutContext.Provider>
      );
    }

    // ==========================================
    // 5. SHARED UI COMPONENTS
    // ==========================================
    const StatusBadge = ({ status }) => {
      let colors = 'bg-gray-100 text-gray-600'; 
      if (status === 'Finished') colors = 'bg-green-100 text-green-700';
      else if (status === 'Currently Reading') colors = 'bg-blue-100 text-blue-700';
      else if (status === 'Unread') colors = 'bg-purple-100 text-purple-700';
      else if (status === 'Dropped') colors = 'bg-red-100 text-red-700';
      return <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md whitespace-nowrap ${colors}`}>{status}</span>;
    };

    function useOutsideClick(ref, callback) {
      useEffect(() => {
        function handleClickOutside(event) { if (ref.current && !ref.current.contains(event.target)) callback(); }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [ref, callback]);
    }

    const BookCard = ({ book, viewMode }) => {
      const { deleteBook } = useContext(BookContext); 
      const navigate = useNavigate();
      const addToast = useToast();
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <div onClick={() => navigate(`/books/${book.id}`)} className="bg-white p-3 md:p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col hover:shadow-md transition-shadow group relative cursor-pointer h-full">

                  <div className="flex-1 h-1 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full" style={{ width: `${progress}%` }}></div></div>
                  <span>{progress}%</span>

    };

    const EmptyState = ({ title, message, icon: IconCmp, actionText, onAction }) => (
      <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-center bg-white rounded-xl border border-gray-100 border-dashed p-6 md:p-8 animate-fade-in-up">
        <div className="w-14 h-14 md:w-16 md:h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400">
          <IconCmp className="w-6 h-6 md:w-8 md:h-8" />
        </div>
        <h3 className="text-base md:text-lg font-semibold text-gray-900 mb-1">{title}</h3>
        <p className="text-gray-500 text-sm max-w-sm mb-6 px-4">{message}</p>
        {actionText && onAction && (
          <button onClick={onAction} className="px-4 py-2 bg-brand-50 text-brand-600 font-medium rounded-lg text-sm hover:bg-brand-100 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500">
            {actionText}
          </button>
        )}
      </div>
    );

    // ==========================================
    // 6. DASHBOARD
    // ==========================================
    const Dashboard = () => {
      const { books, readingGoal, setReadingGoal } = useContext(BookContext);
      const navigate = useNavigate(); const addToast = useToast();

      const stats = useMemo(() => {
        const thisYear = new Date().getFullYear();
        const thisMonth = new Date().getMonth();
        const libraryBooks = books.filter(b => !b.wantToBuy);
        const owned = books.filter(b => b.ownership === 'Owned');
        const unread = libraryBooks.filter(b => b.status === 'Unread');
        const currentlyReading = libraryBooks.filter(b => b.status === 'Currently Reading');
        const finishedAll = libraryBooks.filter(b => b.status === 'Finished').sort((a,b) => new Date(b.dateFinished || b.dateAdded) - new Date(a.dateFinished || a.dateAdded));
        
        const finishedThisYear = finishedAll.filter(b => new Date(b.dateFinished || b.dateAdded).getFullYear() === thisYear);
        const finishedThisMonth = finishedThisYear.filter(b => new Date(b.dateFinished || b.dateAdded).getMonth() === thisMonth);
        const totalPages = libraryBooks.reduce((sum, b) => sum + (parseInt(b.readPages) || 0), 0);
        const ratedBooks = libraryBooks.filter(b => b.rating > 0);
        const avgRating = ratedBooks.length > 0 ? (ratedBooks.reduce((sum, b) => sum + b.rating, 0) / ratedBooks.length).toFixed(1) : '0.0';

        const journey = new Array(12).fill(0);
        finishedThisYear.forEach(b => { journey[new Date(b.dateFinished || b.dateAdded).getMonth()]++; });

        return { total: libraryBooks.length, owned: owned.length, unread: unread.length, reading: currentlyReading, finished: finishedAll, toBuy: books.filter(b => b.wantToBuy).length, finishedThisYearCount: finishedThisYear.length, finishedThisMonthCount: finishedThisMonth.length, totalPages, avgRating, journey, currentYear: thisYear };
      }, [books]);

      const goalProgress = readingGoal > 0 ? Math.min(Math.round((stats.finishedThisYearCount / readingGoal) * 100), 100) : 0;
      
      const handleEditGoal = () => {
        const newGoal = parseInt(window.prompt('Enter your yearly reading goal (number of books):', readingGoal), 10);
        if (!isNaN(newGoal) && newGoal > 0) { setReadingGoal(newGoal); addToast('Goal updated'); }
      };

      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const maxJourney = Math.max(...stats.journey, 5);

      return (
        <div className="space-y-6 md:space-y-8 animate-fade-in-up">
          <div>
            <h2 className="text-xl md:text-2xl font-bold text-gray-900 mb-4 md:mb-6">Good morning! 👋</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 md:gap-4">
              {[ { label: 'Total Books', value: stats.total, color: 'text-gray-900' }, { label: 'Owned', value: stats.owned, color: 'text-gray-900' }, { label: 'Unread', value: stats.unread, color: 'text-purple-600' }, { label: 'Reading', value: stats.reading.length, color: 'text-blue-600' }, { label: 'Finished', value: stats.finished.length, color: 'text-green-600' }, { label: 'To Buy', value: stats.toBuy, color: 'text-yellow-600' } ].map((s, i) => (

                  <p className="text-[10px] md:text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">{s.label}</p>
                  <p className={`text-xl md:text-2xl font-bold ${s.color}`}>{s.value}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
            <div className="lg:col-span-2 space-y-4">
              <h3 className="text-base md:text-lg font-bold text-gray-900 flex items-center gap-2"><Icons.BookOpen className="w-5 h-5 text-brand-600" /> Currently Reading</h3>
              {stats.reading.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {stats.reading.map(book => {
                    const progress = book.totalPages > 0 ? Math.round((book.readPages / book.totalPages) * 100) : (book.progress || 0);
                    return (
                      <div key={book.id} onClick={() => navigate(`/books/${book.id}`)} className="bg-white p-3 md:p-4 rounded-xl border border-gray-100 shadow-sm flex items-start gap-4 hover:shadow-md transition-shadow cursor-pointer">
                        <img src={book.cover} alt={book.title} className="w-16 h-24 md:w-20 md:h-28 object-cover rounded-md border border-gray-100 shadow-sm shrink-0" loading="lazy" />
                        <div className="flex-1 flex flex-col h-full min-w-0">
                          <h4 className="font-semibold text-gray-900 text-sm mb-1 truncate" title={book.title}>{book.title}</h4>
                          <p className="text-xs text-gray-500 mb-3 md:mb-4 truncate">{book.author}</p>
                          <div className="mt-auto">
                            <div className="flex justify-between text-[10px] md:text-xs text-gray-500 font-medium mb-1.5"><span>{book.readPages} / {book.totalPages} p</span><span className="text-brand-600">{progress}%</span></div>
                            <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div></div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <EmptyState title="Not reading anything" message="You aren't reading any books right now." icon={Icons.BookOpen} actionText="Start a book" onAction={() => navigate('/books')} />
              )}
            </div>

            <div className="space-y-4">
              <div className="flex items-center justify-between"><h3 className="text-base md:text-lg font-bold text-gray-900 flex items-center gap-2"><Icons.Target className="w-5 h-5 text-brand-600" /> Reading Goal {stats.currentYear}</h3><button onClick={handleEditGoal} className="text-gray-400 hover:text-gray-900 p-1" aria-label="Edit Goal"><Icons.Edit2 className="w-4 h-4"/></button></div>
              <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col items-center justify-center text-center h-[176px]">
                <div className="relative w-24 h-24 md:w-28 md:h-28 flex items-center justify-center mb-2">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#f3f4f6" strokeWidth="8" /><circle cx="50" cy="50" r="42" fill="none" stroke="#a855f7" strokeWidth="8" strokeDasharray="264" strokeDashoffset={264 - (goalProgress/100)*264} strokeLinecap="round" className="transition-all duration-1000 ease-out" /></svg>
                  <div className="absolute inset-0 flex flex-col items-center justify-center"><span className="text-xl md:text-2xl font-bold text-gray-900">{stats.finishedThisYearCount}</span><span className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest border-t border-gray-200 pt-1 mt-1">/ {readingGoal}</span></div>
                </div>
                <p className="text-xs text-gray-500 font-medium">{goalProgress >= 100 ? "Goal Achieved! 🎉" : "You're doing great!"}</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 pb-8">
            <div className="lg:col-span-2 space-y-4">
              <div className="flex items-center justify-between"><h3 className="text-base md:text-lg font-bold text-gray-900 flex items-center gap-2"><Icons.CheckCircle2 className="w-5 h-5 text-green-600" /> Recently Finished</h3><button onClick={() => navigate('/books?filter=Finished')} className="text-sm text-brand-600 font-medium hover:text-brand-700">View All</button></div>
              {stats.finished.length > 0 ? (
                <div className="bg-white p-4 md:p-6 rounded-xl border border-gray-100 shadow-sm flex gap-4 md:gap-6 overflow-x-auto custom-scrollbar">
                  {stats.finished.slice(0, 5).map(book => (
                    <div key={book.id} onClick={() => navigate(`/books/${book.id}`)} className="flex flex-col w-20 md:w-24 shrink-0 cursor-pointer group">
                      <img src={book.cover} alt={book.title} className="w-20 h-28 md:w-24 md:h-36 object-cover rounded-md border border-gray-100 shadow-sm mb-2 group-hover:shadow-md transition-shadow" loading="lazy" />
                      <h4 className="font-semibold text-gray-900 text-[11px] md:text-xs truncate leading-tight" title={book.title}>{book.title}</h4>
                      <p className="text-[9px] md:text-[10px] text-gray-500 truncate mt-0.5">{book.rating > 0 ? <span className="flex items-center gap-0.5 text-brand-500"><Icons.Star className="w-3 h-3 fill-current"/> {book.rating}</span> : book.author}</p>
                    </div>
                  ))}
                </div>
              ) : (
                 <EmptyState title="No finished books" message="Books you finish will appear here." icon={Icons.CheckCircle2} />
              )}
            </div>

            <div className="space-y-4">
               <h3 className="text-base md:text-lg font-bold text-gray-900 flex items-center gap-2"><Icons.TrendingUp className="w-5 h-5 text-brand-600" /> Statistics</h3>
               <div className="bg-white p-4 md:p-5 rounded-xl border border-gray-100 shadow-sm space-y-5">
                  <div className="grid grid-cols-2 gap-3 md:gap-4">
                    <div><p className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase">This Month</p><p className="text-lg md:text-xl font-bold text-gray-900">{stats.finishedThisMonthCount} <span className="text-[10px] md:text-xs font-normal text-gray-500">books</span></p></div>
                    <div><p className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase">Total Pages</p><p className="text-lg md:text-xl font-bold text-gray-900">{stats.totalPages.toLocaleString()}</p></div>
                    <div><p className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase">Avg Rating</p><p className="text-lg md:text-xl font-bold text-gray-900 flex items-baseline gap-1">{stats.avgRating} <Icons.Star className="w-3 h-3 md:w-4 md:h-4 fill-brand-500 text-brand-500"/></p></div>
                  </div>
                  <div className="pt-4 border-t border-gray-100">
                    <p className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase mb-3">Reading Journey ({stats.currentYear})</p>
                    <div className="flex items-end justify-between h-16 md:h-20 gap-0.5 md:gap-1">
                      {stats.journey.map((val, idx) => (
                        <div key={idx} className="flex flex-col items-center flex-1 group relative">
                          <div className="w-full bg-brand-100 rounded-t-sm" style={{ height: `${(val / maxJourney) * 100}%`, minHeight: val > 0 ? '4px' : '0' }}></div>
                          <span className="text-[7px] md:text-[8px] text-gray-400 font-medium mt-1">{months[idx]}</span>
                          {val > 0 && <div className="absolute bottom-full mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-gray-800 text-white text-[9px] md:text-[10px] px-1.5 py-0.5 rounded pointer-events-none">{val}</div>}

    // ==========================================
    // 7. VIEWS (Books, Form, Details, Settings)
    // ==========================================
    const MyBooks = () => {
      const { collectionId } = useParams(); const location = useLocation(); const navigate = useNavigate(); const addToast = useToast();
      const { books, collections, renameCollection, deleteCollection } = useContext(BookContext);
      
      const searchParams = new URLSearchParams(location.search);
      const [activeFilter, setActiveFilter] = useState(searchParams.get('filter') || 'All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('Recently Added');
      const [viewMode, setViewMode] = useState('grid');
      
      useEffect(() => { setActiveFilter(searchParams.get('filter') || 'All'); }, [location.search]);

      const currentCollection = collectionId ? collections.find(c => c.id === collectionId) : null;
      const filteredAndSortedBooks = useMemo(() => {
        let res = [...books];
        if (collectionId) res = res.filter(b => b.collections?.includes(collectionId));
        if (activeFilter !== 'All') {
          if (activeFilter === 'Owned') res = res.filter(b => b.ownership === 'Owned');
          else if (activeFilter === 'Not Owned') res = res.filter(b => b.ownership === 'Not Owned');
          else res = res.filter(b => b.status === activeFilter);
        }
        if (searchQuery) {
          const q = searchQuery.toLowerCase(); res = res.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
        }
        res.sort((a, b) => {
          if (sortBy === 'Recently Added') return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
          if (sortBy === 'Title A-Z') return a.title.localeCompare(b.title);
          if (sortBy === 'Author A-Z') return a.author.localeCompare(b.author);
          if (sortBy === 'Rating') return (b.rating || 0) - (a.rating || 0); return 0;
        });
        return res;
      }, [books, activeFilter, searchQuery, sortBy, collectionId]);

      const handleFilterClick = (f) => { setActiveFilter(f); navigate(f === 'All' ? location.pathname : `${location.pathname}?filter=${f}`); };
      const handleRename = () => { const n = window.prompt('Rename collection:', currentCollection?.name); if (n) { renameCollection(currentCollection.id, n); addToast('Collection renamed'); } };
      const handleDelete = () => { if (window.confirm(`Delete "${currentCollection?.name}"? Books remain safe.`)) { deleteCollection(currentCollection.id); addToast('Collection deleted'); navigate('/books'); } };

      return (
        <div className="flex flex-col h-full gap-4 md:gap-6 animate-fade-in-up">
          {currentCollection && (
             <div className="flex flex-wrap items-center gap-3 bg-white p-3 md:p-4 rounded-xl border border-gray-100 shadow-sm">
                <span className="text-gray-500 text-sm font-medium w-full sm:w-auto">Collection: {currentCollection.name}</span>
                <button onClick={handleRename} className="text-sm px-3 py-1.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-gray-700 flex items-center gap-1 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500"><Icons.Edit2 className="w-3 h-3"/> Rename</button>
                <button onClick={handleDelete} className="text-sm px-3 py-1.5 bg-red-50 hover:bg-red-100 rounded-lg text-red-600 flex items-center gap-1 border border-red-100 focus:outline-none focus:ring-2 focus:ring-red-500"><Icons.Trash2 className="w-3 h-3"/> Delete</button>
             </div>
          )}
          <div className="bg-white p-3 md:p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-2 md:pb-0 -mx-3 px-3 md:mx-0 md:px-0">
              {['All', 'Owned', 'Not Owned', 'Unread', 'Currently Reading', 'Finished', 'Dropped'].map(f => (
                <button key={f} onClick={() => handleFilterClick(f)} className={`whitespace-nowrap px-3 md:px-4 py-1.5 rounded-full text-xs md:text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 ${activeFilter === f ? 'bg-brand-50 text-brand-600 border border-brand-200' : 'bg-transparent text-gray-500 hover:bg-gray-50 border border-transparent'}`}>{f}</button>
              ))}
            </div>
            <div className="flex flex-wrap md:flex-nowrap items-center gap-3">
              <div className="relative w-full md:w-auto">
                <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="text" placeholder="Search..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-48 pl-9 pr-4 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50" aria-label="Search books" />
              </div>
              <div className="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="py-1.5 px-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50" aria-label="Sort books">
                  <option value="Recently Added">Recent</option><option value="Title A-Z">Title A-Z</option><option value="Author A-Z">Author A-Z</option><option value="Rating">Rating</option>
                </select>
                <div className="flex items-center bg-gray-50 p-1 rounded-lg border border-gray-200 shrink-0">
                  <button onClick={() => setViewMode('grid')} className={`p-1 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 ${viewMode === 'grid' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400'}`} aria-label="Grid view"><Icons.Grid className="w-4 h-4" /></button>
                  <button onClick={() => setViewMode('list')} className={`p-1 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 ${viewMode === 'list' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400'}`} aria-label="List view"><Icons.List className="w-4 h-4" /></button>
                </div>
              </div>
            </div>
          </div>
          <div className="flex-1 pb-4">
            {filteredAndSortedBooks.length > 0 ? (
              <div className={viewMode === 'grid' ? "grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6" : "flex flex-col gap-3 md:gap-4"}>
                {filteredAndSortedBooks.map(b => <BookCard key={b.id} book={b} viewMode={viewMode} />)}
              </div>
            ) : (
              <EmptyState title="No books found" message="We couldn't find any books matching your current filters or search." icon={Icons.Library} actionText="Clear Filters" onAction={() => { handleFilterClick('All'); setSearchQuery(''); }} />
            )}
          </div>
        </div>
      );
    };

    const ToBuyPage = () => {
      const { books, updateBook } = useContext(BookContext); const navigate = useNavigate(); const addToast = useToast();
      const wishList = useMemo(() => books.filter(b => b.wantToBuy), [books]);

      const handlePurchase = (book) => {
        updateBook({ ...book, wantToBuy: false, ownership: 'Owned', status: book.status || 'Unread', dateAdded: new Date().toISOString() });
        addToast(`Marked "${book.title}" as purchased!`);
      };

      if (wishList.length === 0) return <EmptyState title="Your wishlist is empty" message="Books marked as 'Want to Buy' will appear here." icon={Icons.ShoppingCart} actionText="Add a Book" onAction={() => navigate('/books/add')} />;

      const getPrioColor = (p) => p === 'High' ? 'text-red-600 bg-red-50 border-red-200' : p === 'Medium' ? 'text-orange-600 bg-orange-50 border-orange-200' : 'text-green-600 bg-green-50 border-green-200';

      return (
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden animate-fade-in-up">
          <div className="overflow-x-auto custom-scrollbar">
            <table className="w-full text-left border-collapse min-w-[600px]">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider"><th className="p-3 md:p-4 pl-4 md:pl-6">Book Details</th><th className="p-3 md:p-4">Priority</th><th className="p-3 md:p-4">Price</th><th className="p-3 md:p-4 pr-4 md:pr-6 text-right">Actions</th></tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {wishList.map(b => (
                  <tr key={b.id} className="hover:bg-gray-50/50 transition-colors">
                    <td className="p-3 md:p-4 pl-4 md:pl-6 flex items-center gap-3 md:gap-4 cursor-pointer" onClick={() => navigate(`/books/${b.id}`)}>
                      <img src={b.cover} alt={b.title} className="w-10 h-14 md:w-12 md:h-16 object-cover rounded shadow-sm border border-gray-100" loading="lazy" />
                      <div><h4 className="font-semibold text-gray-900 text-sm md:text-base line-clamp-1">{b.title}</h4><p className="text-xs md:text-sm text-gray-500 line-clamp-1">{b.author}</p></div>
                    </td>
                    <td className="p-3 md:p-4"><span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] md:text-xs font-medium border whitespace-nowrap ${getPrioColor(b.priority)}`}>{b.priority}</span></td>
                    <td className="p-3 md:p-4 font-medium text-gray-900 text-sm">{b.price > 0 ? `₹${b.price}` : '-'}</td>
                    <td className="p-3 md:p-4 pr-4 md:pr-6 text-right space-x-2 md:space-x-3 whitespace-nowrap">
                      <button onClick={() => handlePurchase(b)} className="text-xs md:text-sm px-2.5 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-600 font-medium rounded border border-brand-200 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500">Purchased</button>
                      <button onClick={() => navigate(`/books/${b.id}/edit`)} className="text-gray-400 hover:text-gray-900 p-1 rounded focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Edit"><Icons.Edit2 className="w-4 h-4 inline"/></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    const BookForm = () => {
      const { id } = useParams(); const navigate = useNavigate(); const addToast = useToast();
      const { books, collections, addBook, updateBook } = useContext(BookContext);
      const existingBook = id ? books.find(b => b.id === id) : null;

      const [formData, setFormData] = useState(existingBook || { title: '', author: '', cover: '', totalPages: '', readPages: 0, genre: '', isbn: '', status: 'Unread', ownership: 'Owned', rating: 0, notes: '', wantToBuy: false, priority: 'Medium', price: '', collections: [], dateFinished: null });

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        if (name === 'wantToBuy') setFormData({ ...formData, wantToBuy: checked, ownership: checked ? 'Not Owned' : 'Owned' });
        else setFormData({ ...formData, [name]: type === 'checkbox' ? checked : value });
      };
      const handleCollectionToggle = (colId) => setFormData(p => ({ ...p, collections: p.collections.includes(colId) ? p.collections.filter(i => i !== colId) : [...p.collections, colId] }));

      const handleSubmit = (e) => {
        e.preventDefault();
        let dataToSave = { ...formData, totalPages: parseInt(formData.totalPages) || 0, readPages: parseInt(formData.readPages) || 0, rating: parseInt(formData.rating) || 0, price: parseFloat(formData.price) || 0 };
        if (!dataToSave.cover) dataToSave.cover = `https://placehold.co/300x450/fdfbf7/333333?text=${encodeURIComponent(dataToSave.title)}`;

        if (dataToSave.status === 'Finished') { dataToSave.readPages = dataToSave.totalPages; dataToSave.progress = 100; if (existingBook?.status !== 'Finished') dataToSave.dateFinished = new Date().toISOString(); }
        else if (dataToSave.status === 'Unread') { dataToSave.readPages = 0; dataToSave.progress = 0; }
        else { dataToSave.progress = dataToSave.totalPages ? Math.round((dataToSave.readPages / dataToSave.totalPages) * 100) : 0; }

        if (id) { updateBook(dataToSave); addToast('Book updated'); } else { addBook(dataToSave); addToast('Book added'); }
        navigate(-1);
      };

      const inputClass = "w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/50 bg-white text-sm";
      const labelClass = "block text-xs font-medium text-gray-600 mb-1.5";

      return (
        <div className="max-w-4xl mx-auto bg-white p-4 md:p-8 rounded-xl border border-gray-100 shadow-sm animate-fade-in-up">
          <button onClick={() => navigate(-1)} className="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 mb-4 focus:outline-none focus:ring-2 focus:ring-brand-500 rounded p-1 -ml-1"><Icons.ArrowLeft className="w-4 h-4"/> Back</button>
          <h2 className="text-xl md:text-2xl font-bold text-gray-900 mb-6">{id ? 'Edit Book' : 'Add New Book'}</h2>
          
          <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
              <div className="space-y-5">
                <div className="bg-gray-50/80 p-4 md:p-5 rounded-xl border border-gray-100 space-y-4">
                  <h3 className="font-semibold text-sm text-gray-900 border-b border-gray-200 pb-2">Core Information</h3>
                  <div><label className={labelClass}>Title <span className="text-red-500">*</span></label><input required type="text" name="title" value={formData.title} onChange={handleChange} className={inputClass} placeholder="Book title" /></div>
                  <div><label className={labelClass}>Author <span className="text-red-500">*</span></label><input required type="text" name="author" value={formData.author} onChange={handleChange} className={inputClass} placeholder="Author name" /></div>
                  <div><label className={labelClass}>Cover Image URL</label><input type="url" name="cover" value={formData.cover} onChange={handleChange} className={inputClass} placeholder="https://..." /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className={labelClass}>Total Pages</label><input type="number" min="0" name="totalPages" value={formData.totalPages} onChange={handleChange} className={inputClass} /></div>
                    <div><label className={labelClass}>Genre</label><input type="text" name="genre" value={formData.genre} onChange={handleChange} className={inputClass} /></div>
                  </div>
                </div>

                <div className="bg-gray-50/80 p-4 md:p-5 rounded-xl border border-gray-100">
                  <h3 className="font-semibold text-sm text-gray-900 border-b border-gray-200 pb-2 mb-3">Add to Collections</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-40 overflow-y-auto custom-scrollbar pr-2">
                    {collections.length === 0 ? <p className="text-xs text-gray-500 italic col-span-2">No collections available.</p> : collections.map(col => (
                      <label key={col.id} className="flex items-center gap-2.5 text-sm text-gray-700 cursor-pointer p-1 rounded hover:bg-gray-100">
                        <input type="checkbox" checked={formData.collections.includes(col.id)} onChange={() => handleCollectionToggle(col.id)} className="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-500" /> <span className="truncate">{col.name}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-5">
                <div className={`p-4 md:p-5 rounded-xl border transition-colors ${formData.wantToBuy ? 'bg-yellow-50/50 border-yellow-200' : 'bg-gray-50/80 border-gray-100'}`}>
                  <label className="flex items-center gap-3 font-semibold text-gray-900 cursor-pointer select-none">
                    <input type="checkbox" name="wantToBuy" checked={formData.wantToBuy} onChange={handleChange} className="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-500" /> I want to buy this book
                  </label>
                  {formData.wantToBuy && (
                    <div className="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-yellow-200/50 animate-fade-in-up">
                      <div><label className={labelClass}>Priority</label><select name="priority" value={formData.priority} onChange={handleChange} className={inputClass}><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select></div>
                      <div><label className={labelClass}>Price (₹)</label><input type="number" min="0" step="0.01" name="price" value={formData.price} onChange={handleChange} className={inputClass} /></div>
                    </div>
                  )}
                </div>

                <div className={`bg-gray-50/80 p-4 md:p-5 rounded-xl border border-gray-100 space-y-4 transition-opacity ${formData.wantToBuy ? 'opacity-50 pointer-events-none' : ''}`}>
                  <h3 className="font-semibold text-sm text-gray-900 border-b border-gray-200 pb-2">Library Status</h3>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className={labelClass}>Ownership</label><select name="ownership" value={formData.ownership} onChange={handleChange} className={inputClass}><option value="Owned">Owned</option><option value="Not Owned">Not Owned</option></select></div>
                    <div><label className={labelClass}>Status</label><select name="status" value={formData.status} onChange={handleChange} className={inputClass}><option value="Unread">Unread</option><option value="Currently Reading">Currently Reading</option><option value="Finished">Finished</option><option value="Dropped">Dropped</option></select></div>
                  </div>
                  {formData.status === 'Currently Reading' && (
                    <div className="animate-fade-in-up"><label className={labelClass}>Current Page</label><input type="number" min="0" max={formData.totalPages || undefined} name="readPages" value={formData.readPages} onChange={handleChange} className={inputClass} /></div>
                  )}
                  <div><label className={labelClass}>Rating (0-5)</label><input type="number" min="0" max="5" step="0.5" name="rating" value={formData.rating} onChange={handleChange} className={inputClass} /></div>
                </div>

                <div className="bg-gray-50/80 p-4 md:p-5 rounded-xl border border-gray-100">
                  <label className={labelClass}>Notes</label>
                  <textarea name="notes" rows="3" value={formData.notes} onChange={handleChange} className={`${inputClass} resize-none`} placeholder="Your thoughts..."></textarea>
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-3 pt-6 border-t border-gray-100">
              <button type="button" onClick={() => navigate(-1)} className="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors">Cancel</button>
              <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition-colors">Save Book</button>
            </div>
          </form>
        </div>
      );
    };

    const BookDetails = () => {
      const { id } = useParams(); const navigate = useNavigate(); const addToast = useToast();
      const { books, collections, updateBook, deleteBook } = useContext(BookContext);
      const book = books.find(b => b.id === id);
      const [readPages, setReadPages] = useState(book?.readPages || 0);

      useEffect(() => { if (book) setReadPages(book.readPages || 0); }, [book]);

      if (!book) return <EmptyState title="Book not found" message="This book may have been deleted." icon={Icons.BookOpen} actionText="Go to Library" onAction={() => navigate('/books')} />;

      const handleUpdateProgress = () => {
        const val = parseInt(readPages) || 0; const total = book.totalPages || 0;
        let newStatus = book.status; let newDateFinished = book.dateFinished;
        const progress = total > 0 ? Math.round((val/total)*100) : 0;
        if (val >= total && total > 0) { newStatus = 'Finished'; if (book.status !== 'Finished') newDateFinished = new Date().toISOString(); }
        updateBook({ ...book, readPages: val, progress, status: newStatus, dateFinished: newDateFinished });
        addToast(newStatus === 'Finished' ? 'Book finished! 🎉' : 'Progress saved');
      };

      const bookCollections = collections.filter(c => book.collections?.includes(c.id));
      const currentProgress = book.totalPages > 0 ? Math.round((book.readPages / book.totalPages) * 100) : (book.progress || 0);

      return (
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-6 md:gap-8 animate-fade-in-up">
          <div className="w-full md:w-72 shrink-0 flex flex-col gap-4">
            <button onClick={() => navigate(-1)} className="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 mb-2 w-fit rounded p-1 -ml-1 focus:outline-none focus:ring-2 focus:ring-brand-500"><Icons.ArrowLeft className="w-4 h-4"/> Back</button>
            <div className="bg-white p-4 md:p-5 rounded-xl border border-gray-100 shadow-sm text-center">
              <img src={book.cover} alt={book.title} className="w-full aspect-[2/3] object-cover rounded-lg border border-gray-100 mb-4 shadow-sm" loading="lazy" />
              {book.wantToBuy ? <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-yellow-100 text-yellow-700">Want to Buy</span> : <StatusBadge status={book.status} />}
              <div className="flex items-center justify-center gap-1 mt-4 text-brand-500" aria-label={`Rating: ${book.rating} stars`}>
                {[1,2,3,4,5].map(star => <Icons.Star key={star} className={`w-4 h-4 md:w-5 md:h-5 ${star <= book.rating ? 'fill-current' : 'text-gray-200'}`} aria-hidden="true" />)}
              </div>
              <div className="grid grid-cols-2 gap-2 mt-6">
                <button onClick={() => navigate(`/books/${book.id}/edit`)} className="px-3 py-2 text-sm bg-gray-50 text-gray-700 rounded-lg hover:bg-gray-100 flex justify-center items-center gap-1.5 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors"><Icons.Edit2 className="w-3.5 h-3.5"/> Edit</button>
                <button onClick={() => { if(window.confirm(`Delete "${book.title}"?`)) { deleteBook(book.id); addToast('Book deleted'); navigate('/books'); } }} className="px-3 py-2 text-sm bg-red-50 text-red-600 rounded-lg hover:bg-red-100 flex justify-center items-center gap-1.5 border border-red-100 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors"><Icons.Trash2 className="w-3.5 h-3.5"/> Delete</button>
              </div>
            </div>

            {book.status === 'Currently Reading' && !book.wantToBuy && (
              <div className="bg-white p-4 md:p-5 rounded-xl border border-gray-100 shadow-sm">
                <h4 className="font-semibold text-sm text-gray-900 mb-3">Update Progress</h4>
                <div className="flex items-center gap-2 mb-3">
                  <input type="number" min="0" max={book.totalPages || undefined} value={readPages} onChange={(e) => setReadPages(e.target.value)} className="w-20 px-2 py-1.5 text-sm border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-brand-500/50 text-center" aria-label="Current page" />
                  <span className="text-sm text-gray-500">/ {book.totalPages || '?'} p</span>
                </div>
                <div className="flex items-center gap-2 text-xs text-gray-400 font-medium mb-4">
                  <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full transition-all duration-300" style={{ width: `${currentProgress}%` }}></div></div>
                  <span>{currentProgress}%</span>
                </div>
                <button onClick={handleUpdateProgress} className="w-full py-2 bg-brand-50 text-brand-600 text-sm font-medium rounded-lg hover:bg-brand-100 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500">Save Progress</button>
              </div>
            )}
          </div>

          <div className="flex-1 bg-white rounded-xl border border-gray-100 shadow-sm p-5 md:p-8 flex flex-col">
            <h1 className="text-2xl md:text-3xl font-bold text-gray-900 mb-1">{book.title}</h1>
            <p className="text-base md:text-lg text-gray-500 mb-6">{book.author}</p>

            {bookCollections.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-8">
                {bookCollections.map(c => <span key={c.id} className="text-xs font-medium px-2.5 py-1 bg-brand-50 text-brand-700 rounded-md border border-brand-100 flex items-center gap-1.5"><Icons.Hash className="w-3.5 h-3.5"/> {c.name}</span>)}
              </div>
            )}

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 mb-8 pb-8 border-b border-gray-100">
              <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Pages</p><p className="font-semibold text-gray-900 text-sm">{book.totalPages || '-'}</p></div>
              <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Ownership</p><p className="font-semibold text-gray-900 text-sm">{book.ownership}</p></div>
              {book.wantToBuy ? (
                <>
                  <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Priority</p><p className="font-semibold text-gray-900 text-sm">{book.priority}</p></div>
                  <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Price</p><p className="font-semibold text-gray-900 text-sm">{book.price ? `₹${book.price}` : '-'}</p></div>
                </>
              ) : (
                 <>
                   <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Genre</p><p className="font-semibold text-gray-900 text-sm truncate" title={book.genre}>{book.genre || '-'}</p></div>
                   <div><p className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">ISBN</p><p className="font-semibold text-gray-900 text-sm truncate" title={book.isbn}>{book.isbn || '-'}</p></div>
                 </>
              )}
            </div>

            <div className="flex-1">
              <h3 className="text-base md:text-lg font-semibold text-gray-900 mb-3">My Notes</h3>
              <div className="bg-gray-50 rounded-lg p-4 md:p-5 h-full min-h-[150px] border border-gray-100">
                 <p className="text-sm md:text-base text-gray-600 leading-relaxed whitespace-pre-wrap">{book.notes || <span className="italic text-gray-400">No notes added yet.</span>}</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SettingsPage = () => {
      const { exportLibrary, importLibrary, resetLibrary } = useContext(BookContext); const addToast = useToast();
      const fileInputRef = useRef(null);

      const handleFileChange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (window.confirm("Overwrite current library? This cannot be undone.")) { importLibrary(parsed); addToast('Library restored successfully'); }
          } catch (err) { addToast(`Import failed: ${err.message}`, 'error'); }
          finally { if (fileInputRef.current) fileInputRef.current.value = ''; }
        };
        reader.readAsText(file);
      };
      
      const handleReset = () => { 
        if (window.confirm("Reset library to factory defaults? All custom books and collections will be permanently deleted.")) { 
          resetLibrary(); addToast('Library reset to defaults', 'error'); 
        } 
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 animate-fade-in-up">
          <div className="bg-white p-5 md:p-8 rounded-xl border border-gray-100 shadow-sm">
            <h2 className="text-lg md:text-xl font-bold text-gray-900 mb-1.5">Data & Storage Management</h2>
            <p className="text-xs md:text-sm text-gray-500 mb-8">Your data is stored locally in your browser. Backup your data to avoid losing it if you clear your browser cache.</p>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
              <div className="border border-gray-100 rounded-xl p-5 bg-gray-50/50 flex flex-col justify-between">
                <div><div className="w-10 h-10 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600 mb-4"><Icons.Download className="w-5 h-5" /></div><h3 className="font-semibold text-gray-900 text-sm mb-1">Export Library</h3><p className="text-xs text-gray-500 mb-5">Download a full JSON backup of your books and collections.</p></div>
                <button onClick={() => { exportLibrary(); addToast('Backup downloaded'); }} className="w-full py-2 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg shadow-sm flex items-center justify-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-1"><Icons.Download className="w-4 h-4" /> Download Backup</button>
              </div>
              <div className="border border-gray-100 rounded-xl p-5 bg-gray-50/50 flex flex-col justify-between">
                <div><div className="w-10 h-10 bg-purple-50 rounded-lg flex items-center justify-center text-purple-600 mb-4"><Icons.Upload className="w-5 h-5" /></div><h3 className="font-semibold text-gray-900 text-sm mb-1">Import Library</h3><p className="text-xs text-gray-500 mb-5">Restore your library from a previously exported BookNest backup.</p></div>
                <div><input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".json" className="hidden" id="import-file"/><label htmlFor="import-file" className="w-full py-2 px-4 bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 text-sm font-medium rounded-lg cursor-pointer flex items-center justify-center gap-2 shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-1" tabIndex="0" onKeyDown={e => e.key === 'Enter' && fileInputRef.current.click()}><Icons.Upload className="w-4 h-4" /> Select Backup File</label></div>
              </div>
            </div>
            
            <div className="mt-8 pt-6 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div><h4 className="text-sm font-semibold text-red-600 mb-0.5">Danger Zone</h4><p className="text-xs text-gray-500">Permanently delete custom items and restore demo data.</p></div>
              <button onClick={handleReset} className="py-2 px-4 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-sm font-medium rounded-lg flex items-center justify-center gap-2 transition-colors shrink-0 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-1"><Icons.RefreshCw className="w-4 h-4" /> Factory Reset</button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. APP ROUTING
    // ==========================================
    function App() {
      return (
        <ToastProvider>
          <BookProvider>
            <HashRouter>
              <Routes>
                <Route path="/" element={<MainLayout />}>
                  <Route index element={<Dashboard />} />
                  <Route path="books" element={<MyBooks />} />
                  <Route path="collections/:collectionId" element={<MyBooks />} />
                  <Route path="books/add" element={<BookForm />} />
                  <Route path="books/:id" element={<BookDetails />} />
                  <Route path="books/:id/edit" element={<BookForm />} />
                  <Route path="to-buy" element={<ToBuyPage />} />
                  <Route path="settings" element={<SettingsPage />} />
                  <Route path="*" element={<EmptyState title="Page Not Found" message="The page you are looking for doesn't exist." icon={Icons.AlertCircle} />} />
                </Route>
              </Routes>
            </HashRouter>
          </BookProvider>
        </ToastProvider>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
