<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phase 1 to 5</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f3e8ff',
              100: '#e9d5ff',
              500: '#a855f7',
              600: '#6439FF',
              700: '#7e22ce',
            },
            background: '#f8f9fc',
          }
        }
      }
    }
  </script>

  <!-- Custom Scrollbar & Body Styles -->
  <style>
    body {
      background-color: #f8f9fc;
      color: #111827;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 10px;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
    }
  </style>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router DOM (UMD) -->
  <script crossorigin src="https://unpkg.com/@remix-run/router@1.16.1/dist/router.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router@6.23.1/dist/umd/react-router.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@6.23.1/dist/umd/react-router-dom.development.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React Root -->
  <div id="root"></div>

  <!-- Application Code -->
  <script type="text/babel" data-type="module">
    const { useState, useMemo, createContext, useContext, useEffect, useRef } = React;
    const { HashRouter, Routes, Route, NavLink, useLocation, Outlet, useNavigate, useParams, Link } = window.ReactRouterDOM;

    // ==========================================
    // 1. ICON COMPONENTS (Lucide Replacements)
    // ==========================================
    const Icon = ({ children, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Icons = {
      BookOpen: ({className}) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>,
      LayoutDashboard: ({className}) => <Icon className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>,
      Library: ({className}) => <Icon className={className}><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></Icon>,
      CheckCircle2: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
      ShoppingCart: ({className}) => <Icon className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Icon>,
      Settings: ({className}) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>,
      Info: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>,
      Plus: ({className}) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>,
      Hash: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></Icon>,
      Search: ({className}) => <Icon className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>,
      Bell: ({className}) => <Icon className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Icon>,
      Menu: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>,
      MoreVertical: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></Icon>,
      Grid: ({className}) => <Icon className={className}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Icon>,
      List: ({className}) => <Icon className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></Icon>,
      Star: ({className}) => <Icon className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>,
      ArrowLeft: ({className}) => <Icon className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></Icon>,
      Edit2: ({className}) => <Icon className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></Icon>,
      Trash2: ({className}) => <Icon className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>,
      Download: ({className}) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Icon>,
      Upload: ({className}) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>,
      RefreshCw: ({className}) => <Icon className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></Icon>
    };

    // ==========================================
    // 2. PHASE 5: PERSISTENCE & STORAGE SERVICE
    // ==========================================
    const STORAGE_KEY = 'booknest_app_data_v1';

    const defaultCollections = [
      { id: 'c1', name: 'AI and Technology' },
      { id: 'c2', name: 'Psychology' },
      { id: 'c3', name: 'Philosophy' },
      { id: 'c4', name: 'Spirituality' },
      { id: 'c5', name: 'Business' },
      { id: 'c6', name: 'Fiction' }
    ];

    const defaultBooks = [
      {
        id: '1', title: 'Atomic Habits', author: 'James Clear', cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Atomic\nHabits', 
        status: 'Finished', progress: 100, rating: 5, dateAdded: '2023-01-10T10:00:00.000Z', totalPages: 320, readPages: 320, genre: 'Self Help', isbn: '978-1847941831', 
        ownership: 'Owned', wantToBuy: false, priority: 'Medium', price: 0, collections: ['c2', 'c5'], notes: 'Focus on tiny changes. Systems over goals.'
      },
      {
        id: '2', title: 'Deep Work', author: 'Cal Newport', cover: 'https://placehold.co/300x450/f0f4f8/333333?text=Deep\nWork', 
        status: 'Currently Reading', progress: 62, rating: 0, dateAdded: '2023-05-12T10:00:00.000Z', totalPages: 296, readPages: 184, genre: 'Productivity', isbn: '978-1455586691', 
        ownership: 'Owned', wantToBuy: false, priority: 'Medium', price: 0, collections: ['c5'], notes: 'Rules for focused success in a distracted world.'
      },
      {
        id: '3', title: 'The Almanack of Naval Ravikant', author: 'Eric Jorgenson', cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Naval\nRavikant', 
        status: 'Unread', progress: 0, rating: 0, dateAdded: '2023-06-20T10:00:00.000Z', totalPages: 244, readPages: 0, genre: 'Business', isbn: '978-1544514215', 
        ownership: 'Not Owned', wantToBuy: true, priority: 'High', price: 599, collections: ['c3', 'c5'], notes: 'Highly recommended by peers.'
      }
    ];

    const StorageService = {
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { books: defaultBooks, collections: defaultCollections };
          const parsed = JSON.parse(raw);
          return {
            books: Array.isArray(parsed.books) ? parsed.books : defaultBooks,
            collections: Array.isArray(parsed.collections) ? parsed.collections : defaultCollections
          };
        } catch (e) {
          console.error("Failed to load local storage data", e);
          return { books: defaultBooks, collections: defaultCollections };
        }
      },
      save(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error("Failed to save to local storage", e);
        }
      },
      reset() {
        localStorage.removeItem(STORAGE_KEY);
        return { books: defaultBooks, collections: defaultCollections };
      }
    };

    // ==========================================
    // 3. CENTRAL STATE MANAGEMENT (CONTEXT)
    // ==========================================
    const BookContext = createContext();

    const BookProvider = ({ children }) => {
      const [data, setData] = useState(() => StorageService.load());

      // Auto-save on every state modification
      useEffect(() => {
        StorageService.save(data);
      }, [data]);

      const books = data.books;
      const collections = data.collections;

      // Book Actions
      const addBook = (book) => {
        setData(prev => ({
          ...prev,
          books: [...prev.books, { ...book, id: Date.now().toString(), dateAdded: new Date().toISOString() }]
        }));
      };

      const updateBook = (updatedBook) => {
        setData(prev => ({
          ...prev,
          books: prev.books.map(b => b.id === updatedBook.id ? updatedBook : b)
        }));
      };

      const deleteBook = (id) => {
        setData(prev => ({
          ...prev,
          books: prev.books.filter(b => b.id !== id)
        }));
      };

      // Collection Actions
      const addCollection = (name) => {
        if (!name.trim()) return;
        setData(prev => ({
          ...prev,
          collections: [...prev.collections, { id: 'c' + Date.now(), name: name.trim() }]
        }));
      };

      const renameCollection = (id, newName) => {
        if (!newName.trim()) return;
        setData(prev => ({
          ...prev,
          collections: prev.collections.map(c => c.id === id ? { ...c, name: newName.trim() } : c)
        }));
      };

      const deleteCollection = (id) => {
        setData(prev => ({
          collections: prev.collections.filter(c => c.id !== id),
          books: prev.books.map(b => ({
            ...b,
            collections: (b.collections || []).filter(cid => cid !== id)
          }))
        }));
      };

      // Phase 5 Backup & Restore
      const exportLibrary = () => {
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(data, null, 2))}`;
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", jsonString);
        downloadAnchor.setAttribute("download", `booknest-backup-${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importLibrary = (importedData) => {
        if (!importedData || !Array.isArray(importedData.books) || !Array.isArray(importedData.collections)) {
          throw new Error("Invalid backup format. File must contain valid 'books' and 'collections' arrays.");
        }
        setData(importedData);
      };

      const resetLibrary = () => {
        const defaults = StorageService.reset();
        setData(defaults);
      };

      return (
        <BookContext.Provider value={{ 
          books, addBook, updateBook, deleteBook,
          collections, addCollection, renameCollection, deleteCollection,
          exportLibrary, importLibrary, resetLibrary
        }}>
          {children}
        </BookContext.Provider>
      );
    };

    // ==========================================
    // 4. LAYOUT COMPONENTS (Phase 1 & 4)
    // ==========================================
    const mainLinks = [
      { name: 'Dashboard', path: '/', icon: Icons.LayoutDashboard },
      { name: 'My Books', path: '/books', icon: Icons.Library },
      { name: 'To Buy', path: '/to-buy', icon: Icons.ShoppingCart },
    ];

    function Sidebar() {
      const { collections, addCollection } = useContext(BookContext);
      const navClass = ({ isActive }) =>
        `flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${
          isActive ? 'bg-brand-50 text-brand-600' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'
        }`;

      const handleNewCollection = () => {
        const name = window.prompt('Enter new collection name:');
        if (name) addCollection(name);
      };

      return (
        <aside className="w-64 h-screen bg-white border-r border-gray-100 flex flex-col sticky top-0 shrink-0 hidden md:flex z-20">
          <div className="h-20 flex items-center px-6 gap-2 text-brand-600 font-bold text-xl">
            <Icons.BookOpen className="w-6 h-6 fill-current" /><span>BookNest</span>
          </div>
          <div className="flex-1 overflow-y-auto px-4 py-2 space-y-8 custom-scrollbar">
            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">MAIN</p>
              <nav className="flex flex-col gap-1">
                {mainLinks.map((link) => (
                  <NavLink key={link.name} to={link.path} className={navClass}><link.icon className="w-4 h-4" />{link.name}</NavLink>
                ))}
              </nav>
            </div>
            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">COLLECTIONS</p>
              <nav className="flex flex-col gap-1">
                {collections.map((collection) => (
                  <NavLink key={collection.id} to={`/collections/${collection.id}`} className={navClass}>
                    <Icons.Hash className="w-4 h-4" />{collection.name}
                  </NavLink>
                ))}
                <button onClick={handleNewCollection} className="flex items-center gap-3 px-4 py-2.5 mt-2 text-sm font-medium text-brand-600 hover:bg-brand-50 rounded-lg transition-colors text-left">
                  <Icons.Plus className="w-4 h-4" /> New Collection
                </button>
              </nav>
            </div>
          </div>
          <div className="p-4 border-t border-gray-100">
            <nav className="flex flex-col gap-1">
              <NavLink to="/settings" className={navClass}>
                <Icons.Settings className="w-4 h-4" />
                Settings
              </NavLink>
            </nav>
          </div>
        </aside>
      );
    }

    function Topbar() {
      const location = useLocation();
      const navigate = useNavigate();
      const { collections } = useContext(BookContext);

      const getPageTitle = () => {
        if (location.pathname === '/') return 'Dashboard';
        if (location.pathname === '/books') return 'My Books';
        if (location.pathname === '/books/add') return 'Add New Book';
        if (location.pathname.includes('/edit')) return 'Edit Book';
        if (location.pathname.startsWith('/books/')) return 'Book Details';
        if (location.pathname === '/to-buy') return 'To Buy';
        if (location.pathname === '/settings') return 'Settings & Backup';
        if (location.pathname.startsWith('/collections/')) {
           const id = location.pathname.split('/')[2];
           const col = collections.find(c => c.id === id);
           return col ? col.name : 'Collection';
        }
        return 'BookNest';
      };

      return (
        <header className="h-20 px-4 md:px-8 flex items-center justify-between bg-background sticky top-0 z-10">
          <div className="flex items-center gap-4">
            <button className="md:hidden text-gray-500 hover:text-gray-900"><Icons.Menu className="w-6 h-6" /></button>
            <h1 className="text-xl md:text-2xl font-bold text-gray-900 flex items-center gap-2">
              <Icons.Menu className="w-5 h-5 hidden md:block text-gray-400" /> {getPageTitle()}
            </h1>
          </div>
          <div className="flex items-center gap-4 md:gap-6">
            <button onClick={() => navigate('/books/add')} className="hidden md:flex items-center gap-2 bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 transition-colors shadow-sm">
              <Icons.Plus className="w-4 h-4" /> Add Book
            </button>
            <div className="w-9 h-9 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-semibold cursor-pointer shadow-md shadow-brand-500/30">PS</div>
          </div>
        </header>
      );
    }

    function MainLayout() {
      return (
        <div className="flex h-screen w-full overflow-hidden bg-background">
          <Sidebar />
          <div className="flex-1 flex flex-col min-w-0">
            <Topbar />
            <main className="flex-1 overflow-y-auto px-4 md:px-8 pb-8 custom-scrollbar">
              <Outlet />
            </main>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. REUSABLE UI COMPONENTS (Phase 2, 3 & 4)
    // ==========================================
    const StatusBadge = ({ status }) => {
      let colors = 'bg-gray-100 text-gray-600'; 
      if (status === 'Finished') colors = 'bg-green-100 text-green-700';
      else if (status === 'Currently Reading') colors = 'bg-blue-100 text-blue-700';
      else if (status === 'Unread') colors = 'bg-purple-100 text-purple-700';
      else if (status === 'Dropped') colors = 'bg-red-100 text-red-700';

      return <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md ${colors}`}>{status}</span>;
    };

    function useOutsideClick(ref, callback) {
      useEffect(() => {
        function handleClickOutside(event) { if (ref.current && !ref.current.contains(event.target)) callback(); }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [ref, callback]);
    }

    const BookCard = ({ book, viewMode }) => {
      const { deleteBook } = useContext(BookContext);
      const navigate = useNavigate();
      const [menuOpen, setMenuOpen] = useState(false);
      const menuRef = useRef(null);
      useOutsideClick(menuRef, () => setMenuOpen(false));

      const ActionMenu = () => (
        <div className="relative" ref={menuRef}>
          <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setMenuOpen(!menuOpen); }} className="text-gray-400 hover:text-gray-900 bg-white/80 rounded-full p-1 shadow-sm transition-all z-10">
            <Icons.MoreVertical className="w-5 h-5" />
          </button>
          {menuOpen && (
            <div className="absolute right-0 top-8 w-32 bg-white rounded-lg shadow-xl border border-gray-100 py-1 z-20">
              <button onClick={(e) => { e.stopPropagation(); navigate(`/books/${book.id}/edit`); }} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"><Icons.Edit2 className="w-4 h-4"/> Edit</button>
              <button onClick={(e) => { e.stopPropagation(); if (window.confirm(`Delete "${book.title}"?`)) deleteBook(book.id); }} className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"><Icons.Trash2 className="w-4 h-4"/> Delete</button>
            </div>
          )}
        </div>
      );

      const progress = book.totalPages > 0 ? Math.round((book.readPages / book.totalPages) * 100) : (book.progress || 0);

      if (viewMode === 'list') {
        return (
          <div onClick={() => navigate(`/books/${book.id}`)} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer">
            <img src={book.cover} alt={book.title} className="w-16 h-24 object-cover rounded-md border border-gray-100" />
            <div className="flex-1">
              <h3 className="font-semibold text-gray-900">{book.title}</h3>
              <p className="text-sm text-gray-500">{book.author}</p>
            </div>
            <div className="flex items-center gap-6">
              {book.wantToBuy ? <span className="text-[10px] font-bold uppercase px-2 py-1 bg-yellow-100 text-yellow-700 rounded-md">Want to Buy</span> : <StatusBadge status={book.status} />}
              {book.status === 'Currently Reading' && !book.wantToBuy && (
                <div className="w-24 flex items-center gap-2 text-xs text-gray-400">
                  <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full" style={{ width: `${progress}%` }}></div></div>
                  <span>{progress}%</span>
                </div>
              )}
              <ActionMenu />
            </div>
          </div>
        );
      }

      return (
        <div onClick={() => navigate(`/books/${book.id}`)} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col hover:shadow-md transition-shadow group relative cursor-pointer h-full">
          <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity"><ActionMenu /></div>
          <img src={book.cover} alt={book.title} className="w-full aspect-[2/3] object-cover rounded-lg border border-gray-100 mb-4 shadow-sm" />
          <div className="flex-1 flex flex-col">
            <h3 className="font-semibold text-gray-900 text-sm leading-tight mb-1 line-clamp-2" title={book.title}>{book.title}</h3>
            <p className="text-xs text-gray-500 mb-3">{book.author}</p>
            <div className="mt-auto">
              <div className="flex items-center justify-between mb-2">
                {book.wantToBuy ? <span className="text-[10px] font-bold uppercase px-2 py-1 bg-yellow-100 text-yellow-700 rounded-md">Want to Buy</span> : <StatusBadge status={book.status} />}
              </div>
              {book.status === 'Currently Reading' && !book.wantToBuy && (
                <div className="flex items-center gap-2 text-[10px] text-gray-400 font-medium mt-2">
                  <div className="flex-1 h-1 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full" style={{ width: `${progress}%` }}></div></div>
                  <span>{progress}%</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 6. PAGE VIEWS
    // ==========================================

    // My Books View
    const MyBooks = () => {
      const { collectionId } = useParams();
      const navigate = useNavigate();
      const { books, collections, renameCollection, deleteCollection } = useContext(BookContext);
      
      const [activeFilter, setActiveFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('Recently Added');
      const [viewMode, setViewMode] = useState('grid');
      
      const filters = ['All', 'Owned', 'Not Owned', 'Unread', 'Currently Reading', 'Finished', 'Dropped'];
      const currentCollection = collectionId ? collections.find(c => c.id === collectionId) : null;

      const filteredAndSortedBooks = useMemo(() => {
        let result = [...books];
        
        if (collectionId) result = result.filter(b => b.collections?.includes(collectionId));

        if (activeFilter !== 'All') {
          if (activeFilter === 'Owned') result = result.filter(b => b.ownership === 'Owned');
          else if (activeFilter === 'Not Owned') result = result.filter(b => b.ownership === 'Not Owned');
          else result = result.filter(b => b.status === activeFilter);
        }

        if (searchQuery) {
          const lq = searchQuery.toLowerCase();
          result = result.filter(b => b.title.toLowerCase().includes(lq) || b.author.toLowerCase().includes(lq));
        }

        result.sort((a, b) => {
          if (sortBy === 'Recently Added') return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
          if (sortBy === 'Title A-Z') return a.title.localeCompare(b.title);
          if (sortBy === 'Author A-Z') return a.author.localeCompare(b.author);
          if (sortBy === 'Rating') return (b.rating || 0) - (a.rating || 0);
          return 0;
        });
        return result;
      }, [books, activeFilter, searchQuery, sortBy, collectionId]);

      const handleRenameCollection = () => {
        if (!currentCollection) return;
        const newName = window.prompt('Rename collection:', currentCollection.name);
        if (newName) renameCollection(currentCollection.id, newName);
      };

      const handleDeleteCollection = () => {
        if (!currentCollection) return;
        if (window.confirm(`Delete collection "${currentCollection.name}"? Books will not be deleted.`)) {
          deleteCollection(currentCollection.id);
          navigate('/books');
        }
      };

      return (
        <div className="flex flex-col h-full gap-6">
          {currentCollection && (
             <div className="flex items-center gap-3 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <span className="text-gray-500 text-sm">Collection Actions:</span>
                <button onClick={handleRenameCollection} className="text-sm px-3 py-1.5 bg-gray-50 hover:bg-gray-100 rounded-lg text-gray-700 flex items-center gap-1 border border-gray-200"><Icons.Edit2 className="w-3 h-3"/> Rename</button>
                <button onClick={handleDeleteCollection} className="text-sm px-3 py-1.5 bg-red-50 hover:bg-red-100 rounded-lg text-red-600 flex items-center gap-1 border border-red-100"><Icons.Trash2 className="w-3 h-3"/> Delete Collection</button>
             </div>
          )}

          <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-2 md:pb-0">
              {filters.map(filter => (
                <button key={filter} onClick={() => setActiveFilter(filter)} className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${activeFilter === filter ? 'bg-brand-50 text-brand-600 border border-brand-200' : 'bg-transparent text-gray-500 hover:bg-gray-50 border border-transparent'}`}>
                  {filter}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-3">
              <div className="relative">
                <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="text" placeholder="Search..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="pl-9 pr-4 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm w-40 md:w-48 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
              </div>
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="py-1.5 px-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                <option value="Recently Added">Recently Added</option><option value="Title A-Z">Title A-Z</option><option value="Author A-Z">Author A-Z</option><option value="Rating">Highest Rated</option>
              </select>
              <div className="flex items-center bg-gray-50 p-1 rounded-lg border border-gray-200">
                <button onClick={() => setViewMode('grid')} className={`p-1 rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400'}`}><Icons.Grid className="w-4 h-4" /></button>
                <button onClick={() => setViewMode('list')} className={`p-1 rounded-md transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400'}`}><Icons.List className="w-4 h-4" /></button>
              </div>
            </div>
          </div>
          <div className="flex-1">
            {filteredAndSortedBooks.length > 0 ? (
              <div className={viewMode === 'grid' ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" : "flex flex-col gap-4"}>
                {filteredAndSortedBooks.map(book => <BookCard key={book.id} book={book} viewMode={viewMode} />)}
              </div>
            ) : (
              <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-center bg-white rounded-xl border border-gray-100 border-dashed p-8">
                <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400"><Icons.Library className="w-8 h-8" /></div>
                <h3 className="text-lg font-semibold text-gray-900 mb-1">No books found</h3>
                <p className="text-gray-500 text-sm max-w-sm mb-6">No books matching filters or search.</p>
                <button onClick={() => { setActiveFilter('All'); setSearchQuery(''); }} className="px-4 py-2 bg-brand-50 text-brand-600 font-medium rounded-lg text-sm hover:bg-brand-100">Clear Filters</button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // To Buy Page
    const ToBuyPage = () => {
      const { books, updateBook } = useContext(BookContext);
      const navigate = useNavigate();
      const wishList = useMemo(() => books.filter(b => b.wantToBuy), [books]);

      const handlePurchase = (book) => {
        updateBook({ 
           ...book, 
           wantToBuy: false, 
           ownership: 'Owned', 
           status: book.status || 'Unread',
           dateAdded: new Date().toISOString()
        });
      };

      const getPriorityColor = (prio) => {
        if (prio === 'High') return 'text-red-600 bg-red-50 border-red-200';
        if (prio === 'Medium') return 'text-orange-600 bg-orange-50 border-orange-200';
        return 'text-green-600 bg-green-50 border-green-200';
      };

      if (wishList.length === 0) {
        return (
          <div className="h-full min-h-[400px] flex flex-col items-center justify-center text-center bg-white rounded-xl border border-gray-100 border-dashed p-8">
             <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400"><Icons.ShoppingCart className="w-8 h-8" /></div>
             <h3 className="text-lg font-semibold text-gray-900 mb-1">Your wishlist is empty</h3>
             <p className="text-gray-500 text-sm max-w-sm mb-6">Books marked as "Want to Buy" will appear here.</p>
             <button onClick={() => navigate('/books/add')} className="px-4 py-2 bg-brand-600 text-white font-medium rounded-lg text-sm hover:bg-brand-700 shadow-sm">Add a Book</button>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <table className="w-full text-left border-collapse">
            <thead>
              <tr className="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <th className="p-4 pl-6">Book Details</th>
                <th className="p-4">Priority</th>
                <th className="p-4">Price</th>
                <th className="p-4 pr-6 text-right">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {wishList.map(book => (
                <tr key={book.id} className="hover:bg-gray-50/50 transition-colors">
                  <td className="p-4 pl-6 flex items-center gap-4 cursor-pointer" onClick={() => navigate(`/books/${book.id}`)}>
                    <img src={book.cover} alt={book.title} className="w-12 h-16 object-cover rounded shadow-sm border border-gray-100" />
                    <div>
                      <h4 className="font-semibold text-gray-900">{book.title}</h4>
                      <p className="text-sm text-gray-500">{book.author}</p>
                    </div>
                  </td>
                  <td className="p-4">
                    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${getPriorityColor(book.priority)}`}>
                       {book.priority} Priority
                    </span>
                  </td>
                  <td className="p-4 font-medium text-gray-900">
                    {book.price > 0 ? `₹${book.price}` : '-'}
                  </td>
                  <td className="p-4 pr-6 text-right space-x-3">
                    <button onClick={() => handlePurchase(book)} className="text-sm px-3 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-600 font-medium rounded border border-brand-200 transition-colors">
                      Mark Purchased
                    </button>
                    <button onClick={() => navigate(`/books/${book.id}/edit`)} className="text-gray-400 hover:text-gray-900"><Icons.Edit2 className="w-4 h-4 inline"/></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    // Add/Edit Book Form
    const BookForm = () => {
      const { id } = useParams();
      const { books, collections, addBook, updateBook } = useContext(BookContext);
      const navigate = useNavigate();
      
      const existingBook = id ? books.find(b => b.id === id) : null;

      const [formData, setFormData] = useState(existingBook || {
        title: '', author: '', cover: '', totalPages: '', readPages: 0,
        genre: '', isbn: '', status: 'Unread', ownership: 'Owned', rating: 0, notes: '',
        wantToBuy: false, priority: 'Medium', price: '', collections: []
      });

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        if (name === 'wantToBuy') {
           setFormData({ ...formData, wantToBuy: checked, ownership: checked ? 'Not Owned' : 'Owned' });
        } else {
           setFormData({ ...formData, [name]: type === 'checkbox' ? checked : value });
        }
      };

      const handleCollectionToggle = (colId) => {
        setFormData(prev => ({
           ...prev, 
           collections: prev.collections.includes(colId) 
              ? prev.collections.filter(id => id !== colId) 
              : [...prev.collections, colId]
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        let dataToSave = { ...formData };
        dataToSave.totalPages = parseInt(dataToSave.totalPages) || 0;
        dataToSave.readPages = parseInt(dataToSave.readPages) || 0;
        dataToSave.rating = parseInt(dataToSave.rating) || 0;
        dataToSave.price = parseFloat(dataToSave.price) || 0;
        if (!dataToSave.cover) dataToSave.cover = `https://placehold.co/300x450/fdfbf7/333333?text=${encodeURIComponent(dataToSave.title)}`;

        if (dataToSave.status === 'Finished') { dataToSave.readPages = dataToSave.totalPages; dataToSave.progress = 100; }
        else if (dataToSave.status === 'Unread') { dataToSave.readPages = 0; dataToSave.progress = 0; }
        else { dataToSave.progress = dataToSave.totalPages ? Math.round((dataToSave.readPages / dataToSave.totalPages) * 100) : 0; }

        if (id) updateBook(dataToSave); else addBook(dataToSave);
        navigate(-1);
      };

      return (
        <div className="max-w-5xl mx-auto bg-white p-6 md:p-8 rounded-xl border border-gray-100 shadow-sm">
          <button onClick={() => navigate(-1)} className="flex items-center gap-2 text-sm text-gray-500 hover:text-gray-900 mb-6"><Icons.ArrowLeft className="w-4 h-4"/> Back</button>
          <h2 className="text-2xl font-bold text-gray-900 mb-6">{id ? 'Edit Book' : 'Add New Book'}</h2>
          
          <form onSubmit={handleSubmit} className="space-y-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div className="space-y-5">
                <div className="bg-gray-50 p-4 rounded-lg border border-gray-100 space-y-4">
                  <h3 className="font-semibold text-sm text-gray-700">Core Information</h3>
                  <div><label className="block text-xs font-medium text-gray-500 mb-1">Title *</label><input required type="text" name="title" value={formData.title} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                  <div><label className="block text-xs font-medium text-gray-500 mb-1">Author *</label><input required type="text" name="author" value={formData.author} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                  <div><label className="block text-xs font-medium text-gray-500 mb-1">Cover Image URL</label><input type="url" name="cover" value={formData.cover} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                  <div className="grid grid-cols-2 gap-4">
                    <div><label className="block text-xs font-medium text-gray-500 mb-1">Total Pages</label><input type="number" name="totalPages" value={formData.totalPages} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                    <div><label className="block text-xs font-medium text-gray-500 mb-1">Genre</label><input type="text" name="genre" value={formData.genre} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                  </div>
                </div>

                <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                  <h3 className="font-semibold text-sm text-gray-700 mb-3">Add to Collections</h3>
                  <div className="grid grid-cols-2 gap-2">
                    {collections.map(col => (
                      <label key={col.id} className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                        <input type="checkbox" checked={formData.collections.includes(col.id)} onChange={() => handleCollectionToggle(col.id)} className="rounded text-brand-600 focus:ring-brand-500" />
                        {col.name}
                      </label>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-5">
                <div className={`p-4 rounded-lg border transition-colors ${formData.wantToBuy ? 'bg-yellow-50/50 border-yellow-200' : 'bg-gray-50 border-gray-100'}`}>
                  <label className="flex items-center gap-3 font-semibold text-gray-900 cursor-pointer">
                    <input type="checkbox" name="wantToBuy" checked={formData.wantToBuy} onChange={handleChange} className="w-4 h-4 rounded text-brand-600 focus:ring-brand-500" />
                    I want to buy this book
                  </label>
                  {formData.wantToBuy && (
                    <div className="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-yellow-100/50">
                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1">Priority</label>
                        <select name="priority" value={formData.priority} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 bg-white">
                          <option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1">Price (₹)</label>
                        <input type="number" name="price" value={formData.price} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" />
                      </div>
                    </div>
                  )}
                </div>

                <div className={`bg-gray-50 p-4 rounded-lg border border-gray-100 space-y-4 ${formData.wantToBuy ? 'opacity-50 pointer-events-none' : ''}`}>
                  <h3 className="font-semibold text-sm text-gray-700">Library Status</h3>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Ownership</label>
                      <select name="ownership" value={formData.ownership} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 bg-white">
                        <option value="Owned">Owned</option><option value="Not Owned">Not Owned</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Reading Status</label>
                      <select name="status" value={formData.status} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500 bg-white">
                        <option value="Unread">Unread</option><option value="Currently Reading">Currently Reading</option>
                        <option value="Finished">Finished</option><option value="Dropped">Dropped</option>
                      </select>
                    </div>
                  </div>
                  {formData.status === 'Currently Reading' && (
                    <div><label className="block text-xs font-medium text-gray-500 mb-1">Current Page</label><input type="number" name="readPages" value={formData.readPages} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                  )}
                  <div><label className="block text-xs font-medium text-gray-500 mb-1">Rating (0-5)</label><input type="number" min="0" max="5" name="rating" value={formData.rating} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500" /></div>
                </div>

                <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                  <label className="block text-xs font-medium text-gray-500 mb-1">Notes</label>
                  <textarea name="notes" rows="3" value={formData.notes} onChange={handleChange} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-500"></textarea>
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-3 pt-4 border-t border-gray-100">
              <button type="button" onClick={() => navigate(-1)} className="px-5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border border-gray-200 rounded-lg">Cancel</button>
              <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm">Save Book</button>
            </div>
          </form>
        </div>
      );
    };

    // Book Details View
    const BookDetails = () => {
      const { id } = useParams();
      const navigate = useNavigate();
      const { books, collections, updateBook, deleteBook } = useContext(BookContext);
      const book = books.find(b => b.id === id);
      const [readPages, setReadPages] = useState(book?.readPages || 0);

      useEffect(() => {
        if (book) setReadPages(book.readPages || 0);
      }, [book]);

      if (!book) return <div className="p-8 text-center text-gray-500">Book not found.</div>;

      const handleUpdateProgress = () => {
        const val = parseInt(readPages) || 0;
        const total = book.totalPages || 0;
        updateBook({ ...book, readPages: val, progress: total > 0 ? Math.round((val/total)*100) : 0 });
        alert('Progress updated!');
      };

      const bookCollections = collections.filter(c => book.collections?.includes(c.id));
      const currentProgress = book.totalPages > 0 ? Math.round((book.readPages / book.totalPages) * 100) : (book.progress || 0);

      return (
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-8">
          <div className="w-full md:w-64 shrink-0 flex flex-col gap-4">
            <button onClick={() => navigate(-1)} className="flex items-center gap-2 text-sm text-gray-500 hover:text-gray-900 mb-2"><Icons.ArrowLeft className="w-4 h-4"/> Back</button>
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
              <img src={book.cover} alt={book.title} className="w-full aspect-[2/3] object-cover rounded-lg border border-gray-100 mb-4 shadow-sm" />
              {book.wantToBuy ? <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-yellow-100 text-yellow-700">Want to Buy</span> : <StatusBadge status={book.status} />}
              <div className="flex items-center justify-center gap-1 mt-4 text-brand-500">
                {[1,2,3,4,5].map(star => <Icons.Star key={star} className={`w-4 h-4 ${star <= book.rating ? 'fill-current' : 'text-gray-200'}`} />)}
              </div>
              <div className="grid grid-cols-2 gap-2 mt-6">
                <button onClick={() => navigate(`/books/${book.id}/edit`)} className="px-3 py-2 text-sm bg-gray-50 text-gray-700 rounded-lg hover:bg-gray-100 flex justify-center items-center gap-1 border border-gray-200"><Icons.Edit2 className="w-3 h-3"/> Edit</button>
                <button onClick={() => { if(window.confirm(`Delete "${book.title}"?`)) { deleteBook(book.id); navigate('/books'); } }} className="px-3 py-2 text-sm bg-red-50 text-red-600 rounded-lg hover:bg-red-100 flex justify-center items-center gap-1 border border-red-100"><Icons.Trash2 className="w-3 h-3"/> Delete</button>
              </div>
            </div>

            {book.status === 'Currently Reading' && !book.wantToBuy && (
              <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <h4 className="font-semibold text-sm mb-3">Update Progress</h4>
                <div className="flex items-center gap-2 mb-2">
                  <input type="number" value={readPages} onChange={(e) => setReadPages(e.target.value)} className="w-16 px-2 py-1 text-sm border border-gray-200 rounded" />
                  <span className="text-sm text-gray-500">/ {book.totalPages} p</span>
                </div>
                <div className="flex items-center gap-2 text-xs text-gray-400 font-medium mb-3">
                  <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-500 rounded-full" style={{ width: `${currentProgress}%` }}></div></div>
                  <span>{currentProgress}%</span>
                </div>
                <button onClick={handleUpdateProgress} className="w-full py-1.5 bg-brand-50 text-brand-600 text-sm font-medium rounded hover:bg-brand-100 transition">Update</button>
              </div>
            )}
          </div>

          <div className="flex-1 bg-white rounded-xl border border-gray-100 shadow-sm p-6 md:p-8">
            <h1 className="text-3xl font-bold text-gray-900 mb-1">{book.title}</h1>
            <p className="text-lg text-gray-500 mb-6">{book.author}</p>

            {bookCollections.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-8">
                {bookCollections.map(c => <span key={c.id} className="text-xs font-medium px-2.5 py-1 bg-brand-50 text-brand-700 rounded-md border border-brand-100 flex items-center gap-1"><Icons.Hash className="w-3 h-3"/> {c.name}</span>)}
              </div>
            )}

            <div className="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8 pb-8 border-b border-gray-100">
              <div><p className="text-sm text-gray-400 mb-1">Pages</p><p className="font-medium">{book.totalPages || '-'}</p></div>
              <div><p className="text-sm text-gray-400 mb-1">Ownership</p><p className="font-medium">{book.ownership}</p></div>
              {book.wantToBuy ? (
                <>
                  <div><p className="text-sm text-gray-400 mb-1">Priority</p><p className="font-medium">{book.priority}</p></div>
                  <div><p className="text-sm text-gray-400 mb-1">Price</p><p className="font-medium">{book.price ? `₹${book.price}` : '-'}</p></div>
                </>
              ) : (
                 <>
                   <div><p className="text-sm text-gray-400 mb-1">Genre</p><p className="font-medium">{book.genre || '-'}</p></div>
                   <div><p className="text-sm text-gray-400 mb-1">ISBN</p><p className="font-medium text-sm">{book.isbn || '-'}</p></div>
                 </>
              )}
            </div>

            <div>
              <h3 className="text-lg font-semibold text-gray-900 mb-3">My Notes</h3>
              <p className="text-gray-600 leading-relaxed whitespace-pre-wrap">{book.notes || 'No notes added yet.'}</p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. PHASE 5: SETTINGS & BACKUP VIEW
    // ==========================================
    const SettingsPage = () => {
      const { exportLibrary, importLibrary, resetLibrary } = useContext(BookContext);
      const fileInputRef = useRef(null);
      const [importStatus, setImportStatus] = useState({ message: '', type: '' });

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (window.confirm("Restoring a backup will overwrite your current library. Do you want to proceed?")) {
              importLibrary(parsed);
              setImportStatus({ message: 'Library restored successfully!', type: 'success' });
            }
          } catch (err) {
            setImportStatus({ message: `Import failed: ${err.message || 'Invalid JSON file.'}`, type: 'error' });
          } finally {
            if (fileInputRef.current) fileInputRef.current.value = '';
          }
        };
        reader.readAsText(file);
      };

      const handleReset = () => {
        if (window.confirm("Are you sure you want to reset your library to the initial defaults? All custom changes will be permanently deleted.")) {
          resetLibrary();
          setImportStatus({ message: 'Library reset to factory defaults.', type: 'info' });
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-6 md:p-8 rounded-xl border border-gray-100 shadow-sm">
            <h2 className="text-xl font-bold text-gray-900 mb-2">Data & Storage Management</h2>
            <p className="text-sm text-gray-500 mb-6">
              All your books, reading progress, and custom collections are automatically saved locally in your browser's persistent storage.
            </p>

            {importStatus.message && (
              <div className={`p-4 rounded-lg text-sm mb-6 ${
                importStatus.type === 'success' ? 'bg-green-50 text-green-700 border border-green-100' :
                importStatus.type === 'error' ? 'bg-red-50 text-red-700 border border-red-100' :
                'bg-blue-50 text-blue-700 border border-blue-100'
              }`}>
                {importStatus.message}
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Export Backup */}
              <div className="border border-gray-100 rounded-xl p-5 bg-gray-50/50 flex flex-col justify-between">
                <div>
                  <div className="w-10 h-10 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600 mb-3">
                    <Icons.Download className="w-5 h-5" />
                  </div>
                  <h3 className="font-semibold text-gray-900 mb-1">Export Library</h3>
                  <p className="text-xs text-gray-500 mb-4">
                    Download a full JSON backup of your books, reading logs, and collections.
                  </p>
                </div>
                <button
                  onClick={exportLibrary}
                  className="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2"
                >
                  <Icons.Download className="w-4 h-4" /> Download Backup
                </button>
              </div>

              {/* Import Backup */}
              <div className="border border-gray-100 rounded-xl p-5 bg-gray-50/50 flex flex-col justify-between">
                <div>
                  <div className="w-10 h-10 bg-purple-50 rounded-lg flex items-center justify-center text-purple-600 mb-3">
                    <Icons.Upload className="w-5 h-5" />
                  </div>
                  <h3 className="font-semibold text-gray-900 mb-1">Import Library</h3>
                  <p className="text-xs text-gray-500 mb-4">
                    Restore your library from a previously exported BookNest JSON backup.
                  </p>
                </div>
                <div>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleFileChange}
                    accept=".json"
                    className="hidden"
                    id="import-file"
                  />
                  <label
                    htmlFor="import-file"
                    className="w-full py-2.5 px-4 bg-white hover:bg-gray-100 text-gray-700 border border-gray-200 text-sm font-medium rounded-lg cursor-pointer transition-colors flex items-center justify-center gap-2 shadow-sm text-center"
                  >
                    <Icons.Upload className="w-4 h-4" /> Select Backup File
                  </label>
                </div>
              </div>
            </div>

            {/* Factory Reset */}
            <div className="mt-8 pt-6 border-t border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h4 className="text-sm font-semibold text-red-600">Reset to Defaults</h4>
                <p className="text-xs text-gray-500">Permanently delete all custom items and restore initial sample books.</p>
              </div>
              <button
                onClick={handleReset}
                className="py-2 px-4 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2 shrink-0"
              >
                <Icons.RefreshCw className="w-4 h-4" /> Reset Library
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Dashboard Overview
    const Dashboard = () => {
      const { books } = useContext(BookContext);
      const totalBooks = books.length;
      const ownedBooks = books.filter(b => b.ownership === 'Owned').length;
      const readingBooks = books.filter(b => b.status === 'Currently Reading' && !b.wantToBuy).length;
      const finishedBooks = books.filter(b => b.status === 'Finished' && !b.wantToBuy).length;
      const toBuyBooks = books.filter(b => b.wantToBuy).length;

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-xl p-8 border border-gray-100 shadow-sm">
            <h2 className="text-xl font-bold mb-1">Good morning, Piyush! 👋</h2>
            <p className="text-gray-500 text-sm">Let's continue your reading journey.</p>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase">Total Books</p>
              <p className="text-2xl font-bold text-gray-900 mt-1">{totalBooks}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase">Owned</p>
              <p className="text-2xl font-bold text-gray-900 mt-1">{ownedBooks}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase">Reading</p>
              <p className="text-2xl font-bold text-brand-600 mt-1">{readingBooks}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase">Finished</p>
              <p className="text-2xl font-bold text-green-600 mt-1">{finishedBooks}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase">To Buy</p>
              <p className="text-2xl font-bold text-yellow-600 mt-1">{toBuyBooks}</p>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. APP ROUTING & MOUNT
    // ==========================================
    function App() {
      return (
        <BookProvider>
          <HashRouter>
            <Routes>
              <Route path="/" element={<MainLayout />}>
                <Route index element={<Dashboard />} />
                <Route path="books" element={<MyBooks />} />
                <Route path="collections/:collectionId" element={<MyBooks />} />
                <Route path="books/add" element={<BookForm />} />
                <Route path="books/:id" element={<BookDetails />} />
                <Route path="books/:id/edit" element={<BookForm />} />
                <Route path="to-buy" element={<ToBuyPage />} />
                <Route path="settings" element={<SettingsPage />} />
                <Route path="*" element={<div className="text-gray-400 p-8 bg-white rounded-xl border border-gray-100 h-96 flex items-center justify-center">Feature coming soon...</div>} />
              </Route>
            </Routes>
          </HashRouter>
        </BookProvider>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
