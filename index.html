<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Phase 1 & 2</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f3e8ff',
              100: '#e9d5ff',
              500: '#a855f7',
              600: '#6439FF',
              700: '#7e22ce',
            },
            background: '#f8f9fc',
          }
        }
      }
    }
  </script>

  <!-- Custom Scrollbar & Body Styles -->
  <style>
    body {
      background-color: #f8f9fc;
      color: #111827;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 10px;
    }
    /* Simple utility to clamp text for book titles */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
    }
  </style>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router DOM (UMD) -->
  <script crossorigin src="https://unpkg.com/@remix-run/router@1.16.1/dist/router.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-router@6.23.1/dist/umd/react-router.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@6.23.1/dist/umd/react-router-dom.development.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React Root -->
  <div id="root"></div>

  <!-- Application Code -->
  <script type="text/babel" data-type="module">
    const { useState, useMemo } = React;
    const { HashRouter, Routes, Route, NavLink, useLocation, Outlet } = window.ReactRouterDOM;

    // --- 1. ICON COMPONENTS ---
    const Icon = ({ children, className = "w-5 h-5" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Icons = {
      BookOpen: ({className}) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>,
      LayoutDashboard: ({className}) => <Icon className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>,
      Library: ({className}) => <Icon className={className}><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></Icon>,
      CheckCircle2: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>,
      ShoppingCart: ({className}) => <Icon className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Icon>,
      Settings: ({className}) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>,
      Info: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>,
      Plus: ({className}) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>,
      Hash: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></Icon>,
      Search: ({className}) => <Icon className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>,
      Bell: ({className}) => <Icon className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Icon>,
      Menu: ({className}) => <Icon className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>,
      MoreVertical: ({className}) => <Icon className={className}><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></Icon>,
      Grid: ({className}) => <Icon className={className}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></Icon>,
      List: ({className}) => <Icon className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></Icon>,
      Star: ({className}) => <Icon className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>,
    };

    // --- 2. PHASE 1: LAYOUT COMPONENTS ---
    const mainLinks = [
      { name: 'Dashboard', path: '/', icon: Icons.LayoutDashboard },
      { name: 'My Books', path: '/books', icon: Icons.Library },
      { name: 'Currently Reading', path: '/reading', icon: Icons.BookOpen },
      { name: 'Finished', path: '/finished', icon: Icons.CheckCircle2 },
      { name: 'To Buy', path: '/to-buy', icon: Icons.ShoppingCart },
    ];

    const collections = [
      'All Collections', 'AI and Technology', 'Psychology', 
      'Philosophy', 'Spirituality', 'Business', 'Fiction'
    ];

    function Sidebar() {
      const navClass = ({ isActive }) =>
        `flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${
          isActive 
            ? 'bg-brand-50 text-brand-600' 
            : 'text-gray-500 hover:bg-gray-100 hover:text-gray-900'
        }`;

      return (
        <aside className="w-64 h-screen bg-white border-r border-gray-100 flex flex-col sticky top-0 shrink-0 hidden md:flex">
          <div className="h-20 flex items-center px-6 gap-2 text-brand-600 font-bold text-xl">
            <Icons.BookOpen className="w-6 h-6 fill-current" />
            <span>BookNest</span>
          </div>

          <div className="flex-1 overflow-y-auto px-4 py-2 space-y-8 custom-scrollbar">
            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">MAIN</p>
              <nav className="flex flex-col gap-1">
                {mainLinks.map((link) => (
                  <NavLink key={link.name} to={link.path} className={navClass}>
                    <link.icon className="w-4 h-4" />
                    {link.name}
                  </NavLink>
                ))}
              </nav>
            </div>

            <div>
              <p className="text-xs font-semibold text-gray-400 mb-3 px-4 tracking-wider">COLLECTIONS</p>
              <nav className="flex flex-col gap-1">
                {collections.map((collection, idx) => (
                  <NavLink key={collection} to={`/collections/${idx}`} className={navClass}>
                    <Icons.Hash className="w-4 h-4" />
                    {collection}
                  </NavLink>
                ))}
                <button className="flex items-center gap-3 px-4 py-2.5 mt-2 text-sm font-medium text-brand-600 hover:bg-brand-50 rounded-lg transition-colors">
                  <Icons.Plus className="w-4 h-4" />
                  New Collection
                </button>
              </nav>
            </div>
          </div>

          <div className="p-4 border-t border-gray-100">
            <nav className="flex flex-col gap-1">
              <NavLink to="/settings" className={navClass}>
                <Icons.Settings className="w-4 h-4" />
                Settings
              </NavLink>
              <NavLink to="/about" className={navClass}>
                <Icons.Info className="w-4 h-4" />
                About
              </NavLink>
            </nav>
          </div>
        </aside>
      );
    }

    function Topbar() {
      const location = useLocation();
      const getPageTitle = () => {
        switch (location.pathname) {
          case '/': return 'Dashboard';
          case '/books': return 'My Books';
          case '/to-buy': return 'To Buy';
          default: return 'BookNest';
        }
      };

      return (
        <header className="h-20 px-4 md:px-8 flex items-center justify-between bg-background sticky top-0 z-10">
          <div className="flex items-center gap-4">
            <button className="md:hidden text-gray-500 hover:text-gray-900">
              <Icons.Menu className="w-6 h-6" />
            </button>
            <h1 className="text-xl md:text-2xl font-bold text-gray-900 flex items-center gap-2">
              <Icons.Menu className="w-5 h-5 hidden md:block text-gray-400" /> 
              {getPageTitle()}
            </h1>
          </div>

          <div className="flex items-center gap-4 md:gap-6">
            <div className="relative hidden md:block">
              <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
              <input 
                type="text" 
                placeholder="Global search..." 
                className="pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-full text-sm w-48 lg:w-64 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
              />
            </div>
            <button className="relative text-gray-500 hover:text-brand-600 transition-colors">
              <Icons.Bell className="w-5 h-5" />
              <span className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
            </button>
            <div className="w-9 h-9 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-semibold cursor-pointer shadow-md shadow-brand-500/30">
              PS
            </div>
          </div>
        </header>
      );
    }

    function MainLayout() {
      return (
        <div className="flex h-screen w-full overflow-hidden bg-background">
          <Sidebar />
          <div className="flex-1 flex flex-col min-w-0">
            <Topbar />
            <main className="flex-1 overflow-y-auto px-4 md:px-8 pb-8 custom-scrollbar">
              <Outlet />
            </main>
          </div>
        </div>
      );
    }

    // --- 3. PHASE 2: DATA & COMPONENTS ---
    
    // Sample Books Data
    const sampleBooks = [
      {
        id: '1', title: 'Atomic Habits', author: 'James Clear', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Atomic\nHabits', 
        status: 'Finished', progress: 100, rating: 5, dateAdded: '2023-01-10'
      },
      {
        id: '2', title: 'Deep Work', author: 'Cal Newport', 
        cover: 'https://placehold.co/300x450/f0f4f8/333333?text=Deep\nWork', 
        status: 'Currently Reading', progress: 62, rating: 0, dateAdded: '2023-05-12'
      },
      {
        id: '3', title: 'The Psychology of Money', author: 'Morgan Housel', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Psychology\nof+Money', 
        status: 'Finished', progress: 100, rating: 5, dateAdded: '2023-02-15'
      },
      {
        id: '4', title: 'Thinking, Fast and Slow', author: 'Daniel Kahneman', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Thinking\nFast\nand+Slow', 
        status: 'Owned', progress: 0, rating: 0, dateAdded: '2023-06-20'
      },
      {
        id: '5', title: 'The Almanack of Naval Ravikant', author: 'Eric Jorgenson', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Naval\nRavikant', 
        status: 'Dropped', progress: 15, rating: 3, dateAdded: '2022-11-05'
      },
      {
        id: '6', title: 'Sapiens: A Brief History of Humankind', author: 'Yuval Noah Harari', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Sapiens', 
        status: 'Finished', progress: 100, rating: 4, dateAdded: '2023-03-10'
      },
      {
        id: '7', title: 'The 5 AM Club', author: 'Robin Sharma', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=5+AM\nClub', 
        status: 'Owned', progress: 0, rating: 0, dateAdded: '2023-07-01'
      },
      {
        id: '8', title: 'Rich Dad Poor Dad', author: 'Robert T. Kiyosaki', 
        cover: 'https://placehold.co/300x450/fdfbf7/333333?text=Rich+Dad\nPoor+Dad', 
        status: 'Finished', progress: 100, rating: 4, dateAdded: '2021-08-22'
      }
    ];

    // Status Badge Helper
    const StatusBadge = ({ status }) => {
      let colors = 'bg-gray-100 text-gray-600'; // Default
      if (status === 'Finished') colors = 'bg-green-100 text-green-700';
      else if (status === 'Currently Reading') colors = 'bg-blue-100 text-blue-700';
      else if (status === 'Owned') colors = 'bg-purple-100 text-purple-700';
      else if (status === 'Dropped') colors = 'bg-red-100 text-red-700';

      return (
        <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md ${colors}`}>
          {status}
        </span>
      );
    };

    // Reusable Book Card Component
    const BookCard = ({ book, viewMode }) => {
      if (viewMode === 'list') {
        return (
          <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
            <img src={book.cover} alt={book.title} className="w-16 h-24 object-cover rounded-md border border-gray-100" />
            <div className="flex-1">
              <h3 className="font-semibold text-gray-900">{book.title}</h3>
              <p className="text-sm text-gray-500">{book.author}</p>
            </div>
            <div className="flex items-center gap-6">
              <StatusBadge status={book.status} />
              {book.status === 'Currently Reading' && (
                <div className="w-24 flex items-center gap-2 text-xs text-gray-400">
                  <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-brand-500 rounded-full" style={{ width: `${book.progress}%` }}></div>
                  </div>
                  <span>{book.progress}%</span>
                </div>
              )}
              <button className="text-gray-400 hover:text-gray-900">
                <Icons.MoreVertical className="w-5 h-5" />
              </button>
            </div>
          </div>
        );
      }

      // Grid View (Default)
      return (
        <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col hover:shadow-md transition-shadow group relative">
          <button className="absolute top-3 right-3 text-gray-400 hover:text-gray-900 opacity-0 group-hover:opacity-100 transition-opacity bg-white/80 rounded-full p-1">
            <Icons.MoreVertical className="w-4 h-4" />
          </button>
          
          <img src={book.cover} alt={book.title} className="w-full aspect-[2/3] object-cover rounded-lg border border-gray-100 mb-4 shadow-sm" />
          
          <div className="flex-1 flex flex-col">
            <h3 className="font-semibold text-gray-900 text-sm leading-tight mb-1 line-clamp-2" title={book.title}>
              {book.title}
            </h3>
            <p className="text-xs text-gray-500 mb-3">{book.author}</p>
            
            <div className="mt-auto">
              <div className="flex items-center justify-between mb-2">
                <StatusBadge status={book.status} />
              </div>
              
              {/* Progress Bar for Currently Reading */}
              {book.status === 'Currently Reading' && (
                <div className="flex items-center gap-2 text-[10px] text-gray-400 font-medium">
                  <div className="flex-1 h-1 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-brand-500 rounded-full" style={{ width: `${book.progress}%` }}></div>
                  </div>
                  <span>{book.progress}%</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // MyBooks Page Component
    const MyBooks = () => {
      // State
      const [books, setBooks] = useState(sampleBooks);
      const [activeFilter, setActiveFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('Recently Added');
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list'

      const filters = ['All', 'Owned', 'Unread', 'Currently Reading', 'Finished', 'Dropped'];

      // Filtering and Sorting Logic
      const filteredAndSortedBooks = useMemo(() => {
        let result = [...books];

        // 1. Filter
        if (activeFilter !== 'All') {
          if (activeFilter === 'Unread') {
            result = result.filter(b => b.status === 'Owned' && b.progress === 0);
          } else {
            result = result.filter(b => b.status === activeFilter);
          }
        }

        // 2. Search
        if (searchQuery) {
          const lowerQuery = searchQuery.toLowerCase();
          result = result.filter(b => 
            b.title.toLowerCase().includes(lowerQuery) || 
            b.author.toLowerCase().includes(lowerQuery)
          );
        }

        // 3. Sort
        result.sort((a, b) => {
          if (sortBy === 'Recently Added') {
            return new Date(b.dateAdded) - new Date(a.dateAdded);
          } else if (sortBy === 'Title A-Z') {
            return a.title.localeCompare(b.title);
          } else if (sortBy === 'Author A-Z') {
            return a.author.localeCompare(b.author);
          } else if (sortBy === 'Rating') {
            return b.rating - a.rating;
          }
          return 0;
        });

        return result;
      }, [books, activeFilter, searchQuery, sortBy]);

      return (
        <div className="flex flex-col h-full gap-6">
          {/* Top Controls / Filters */}
          <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            
            {/* Filter Pills */}
            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-2 md:pb-0">
              {filters.map(filter => (
                <button
                  key={filter}
                  onClick={() => setActiveFilter(filter)}
                  className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                    activeFilter === filter 
                      ? 'bg-brand-50 text-brand-600 border border-brand-200' 
                      : 'bg-transparent text-gray-500 hover:bg-gray-50 border border-transparent'
                  }`}
                >
                  {filter}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-3">
              {/* Local Search */}
              <div className="relative">
                <Icons.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input 
                  type="text" 
                  placeholder="Search library..." 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="pl-9 pr-4 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm w-40 md:w-48 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
                />
              </div>

              {/* Sort Dropdown */}
              <select 
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="py-1.5 px-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
              >
                <option value="Recently Added">Recently Added</option>
                <option value="Title A-Z">Title A-Z</option>
                <option value="Author A-Z">Author A-Z</option>
                <option value="Rating">Highest Rated</option>
              </select>

              {/* View Toggles */}
              <div className="flex items-center bg-gray-50 p-1 rounded-lg border border-gray-200">
                <button 
                  onClick={() => setViewMode('grid')}
                  className={`p-1 rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400 hover:text-gray-600'}`}
                >
                  <Icons.Grid className="w-4 h-4" />
                </button>
                <button 
                  onClick={() => setViewMode('list')}
                  className={`p-1 rounded-md transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-brand-600' : 'text-gray-400 hover:text-gray-600'}`}
                >
                  <Icons.List className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>

          {/* Book Library Content */}
          <div className="flex-1">
            {filteredAndSortedBooks.length > 0 ? (
              <div className={
                viewMode === 'grid' 
                  ? "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" 
                  : "flex flex-col gap-4"
              }>
                {filteredAndSortedBooks.map(book => (
                  <BookCard key={book.id} book={book} viewMode={viewMode} />
                ))}
              </div>
            ) : (
              /* Empty State */
              <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-center bg-white rounded-xl border border-gray-100 border-dashed p-8">
                <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400">
                  <Icons.Library className="w-8 h-8" />
                </div>
                <h3 className="text-lg font-semibold text-gray-900 mb-1">No books found</h3>
                <p className="text-gray-500 text-sm max-w-sm mb-6">
                  We couldn't find any books matching your current filters or search query.
                </p>
                <button 
                  onClick={() => { setActiveFilter('All'); setSearchQuery(''); }}
                  className="px-4 py-2 bg-brand-50 text-brand-600 font-medium rounded-lg text-sm hover:bg-brand-100 transition-colors"
                >
                  Clear Filters
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- 4. PHASE 1: PLACEHOLDER PAGES ---
    const Dashboard = () => (
      <div className="bg-white rounded-xl p-8 border border-gray-100 shadow-sm">
        <h2 className="text-xl font-bold mb-2">Good morning, Piyush! 👋</h2>
        <p className="text-gray-500">Let's continue your reading journey.</p>
        <div className="mt-6 p-4 bg-brand-50 rounded-lg border border-brand-100 inline-block">
          <p className="text-brand-700 text-sm font-medium">Phase 2 update: Click on "My Books" in the sidebar to view the library!</p>
        </div>
      </div>
    );

    // --- 5. APP ENTRY POINT ---
    function App() {
      return (
        <HashRouter>
          <Routes>
            <Route path="/" element={<MainLayout />}>
              <Route index element={<Dashboard />} />
              <Route path="books" element={<MyBooks />} />
              <Route path="to-buy" element={<div className="text-gray-400 p-8 bg-white rounded-xl border border-gray-100 h-96 flex items-center justify-center">To Buy List Placeholder</div>} />
              <Route path="*" element={<div className="text-gray-400 p-8 bg-white rounded-xl border border-gray-100 h-96 flex items-center justify-center">Feature coming soon...</div>} />
            </Route>
          </Routes>
        </HashRouter>
      );
    }

    // Render the App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
